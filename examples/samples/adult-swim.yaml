# Sample — Adult Swim: a network-mirror channel built from schedules.
#
# rule.blocks: the any-time rules — a daytime rerun wheel of the brand's older
# adult-animation titles, airing every hour no schedule claims. The real Adult
# Swim's daytime belongs to Cartoon Network, which this library does not
# carry; a rerun wheel of the same brand's catalog is the honest stand-in, and
# it keeps the 21:00/24:00 boundaries visible in the air order.
#
# rule.slots.primetime: the flagship adult-animation lineup.
# rule.slots.toonami: the Saturday-night anime block.
#
# rule.schedules: `saturday` outranks `nightly` because it names weekdays.
# Its 00:00-03:00 is the three hours after Saturday begins, matching how the
# real schedule places Toonami. `nightly` puts primetime on 21:00-24:00 every
# day. Hours are local to the station's `tz`.
#
# The shows are listed by name rather than resolved from Plex's Adult Swim
# collection, which is a smart collection and ingests zero members (#139).
#
# Registered in examples/station.yaml via the `samples/*.yaml` glob. Resolves
# to nothing unless the station's `catalog_path` points at a populated
# catalog with these shows in it.
number: 6
name: adult-swim
display_name: "Adult Swim"
window_days: 1
roll_interval: "60s"
retention_days: 1

rule:
  blocks:
    - program:
        title: "Adult Swim"
      pools:
        - name: reruns
          expr: >
            item.type == "episode" && item.show in [
              "Aqua Teen Hunger Force", "Metalocalypse", "The Venture Bros.",
              "Home Movies", "Joe Pera Talks with You"
            ]
          order: "random"
      pattern:
        - pool: reruns
          take: 1

  slots:
    primetime:
      program:
        title: "Adult Swim"
      pools:
        - name: primetime
          expr: >
            item.type == "episode" && item.show in [
              "Rick and Morty", "Robot Chicken", "The Boondocks",
              "Harley Quinn", "The Eric Andre Show", "Smiling Friends"
            ]
          order: "random"
      pattern:
        - pool: primetime
          take: 1

    toonami:
      program:
        title: "Toonami"
      pools:
        - name: toonami
          expr: >
            item.type == "episode" && item.show in [
              "Cowboy Bebop", "Samurai Jack", "Fullmetal Alchemist: Brotherhood",
              "Rick and Morty: The Anime", "Primal"
            ]
          order: "random"
      pattern:
        - pool: toonami
          take: 1

  schedules:
    - name: nightly
      hours: { "21..24": primetime }
    - name: saturday
      weekdays: [sat]
      hours: { "00..03": toonami }
