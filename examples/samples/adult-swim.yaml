# Sample — Adult Swim: a network-mirror channel built end to end for #14.
#
# One pattern block with a `schedule:` (ADR 0021): two timed entries plus a
# default, each walking its own pattern over the block's pools. Adult Swim is
# the network mirror this repo can build first: its Plex source is a *smart*
# collection, which ingests zero members (#139), so its shows are listed here
# by name instead of resolved from the collection — the same workaround every
# other network mirror (HBO, Bravo) will need until #139 lands.
#
# Hand-approximated, deliberately (#14 "out of scope" — network-mirror
# fidelity is later enrichment, not this slice):
#   - `primetime` — the block's real identity: the flagship adult-animation
#     lineup, nightly 21:00-24:00.
#   - `toonami` — the Saturday-night anime block, 00:00-03:00 (i.e. the
#     three hours after Saturday begins, matching how the real Adult Swim
#     schedule places it).
#   - `daytime` — every hour neither claims, reusing the library's older
#     adult-animation titles as a daytime rerun wheel rather than leaving the
#     channel dark. The real Adult Swim's daytime hours belong to Cartoon
#     Network, which this library does not carry.
#
# Every pool resumes, so each show continues from the episode it last aired
# whenever its entry's hours come back round.
#
# Registered in examples/station.yaml via the `samples/*.yaml` glob. Resolves
# to nothing unless the station's `catalog_path` points at a populated
# catalog with these shows in it.
number: 6
name: adult-swim
display_name: "Adult Swim"
window_days: 1
roll_interval: "60s"
retention_days: 1

rule:
  blocks:
    - mode: "all"
      program:
        title: "Adult Swim"

      pools:
        - name: primetime
          expr: >
            item.type == "episode" && item.show in [
              "Rick and Morty", "Robot Chicken", "The Boondocks",
              "Harley Quinn", "The Eric Andre Show", "Smiling Friends"
            ]
          order: "season:asc,episode:asc"
          rotate: visit
          advance: resume

        - name: toonami
          expr: >
            item.type == "episode" && item.show in [
              "Cowboy Bebop", "Samurai Jack", "Fullmetal Alchemist: Brotherhood",
              "Rick and Morty: The Anime", "Primal"
            ]
          order: "season:asc,episode:asc"
          rotate: visit
          advance: resume

        - name: reruns
          expr: >
            item.type == "episode" && item.show in [
              "Aqua Teen Hunger Force", "Metalocalypse", "The Venture Bros.",
              "Home Movies", "Joe Pera Talks with You"
            ]
          order: "season:asc,episode:asc"
          rotate: visit
          advance: resume

      schedule:
        - name: primetime
          hours: { start: 21, end: 24 }
          pattern:
            - { pool: primetime, take: 2 }
        - name: toonami
          hours: { start: 0, end: 3 }
          weekdays: [sat]
          pattern:
            - { pool: toonami, take: 2 }
        - name: daytime
          pattern:
            - { pool: reruns, take: 2 }
