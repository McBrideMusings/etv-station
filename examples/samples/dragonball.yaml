# Sample S4 — Dragon Ball, full chronological order.
#
# The hardest authored-order case: a watch order that weaves a film into the
# middle of a series, which nothing in the catalog can derive. The order lives in
# its own file, examples/chronologies/dragonball.yaml, declared in the station's
# `chronologies:` list and referenced here by name — so a second channel wanting
# the same order names it too, and an edit to the order never touches a channel.
#
# The block plays the chronology's entries in position order (`manual` keeps
# them as resolved): season 1, the film, season 2. Every entry must match one
# catalog item, or the channel fails to resolve naming the entry.
#
# Registered in examples/station.yaml via the `samples/*.yaml` glob, so a
# dev-run serves it live. Being a catalog channel it resolves to nothing
# unless the station's `catalog_path` points at a populated catalog. Its
# resolution is also proven by the `dragonball_sample` acceptance test.
number: 9
name: dragonball
display_name: "Dragon Ball"
window_days: 1
roll_interval: "60s"
retention_days: 1

rule:
  blocks:
    - mode: "all"
      order: "manual"
      program:
        title: "Dragon Ball: Chronological"
        categories: ["Series", "Anime"]
      entries:
        - kind: chronology
          name: dragonball
