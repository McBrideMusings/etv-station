# Sample S8 — For You: a taste-scored channel driven by a plugin (#82).
#
# Two movies, then a three-episode run of one show, repeated — but *what* plays
# is not a query anyone wrote. A scorer plugin picks it, ranking the library by
# what the server has actually been watching lately and suppressing whatever
# this channel just aired.
#
# What this exercises that no other sample does:
#   - `plugin` on a pool instead of `expr` (#74) — the plugin runs its own
#     catalog queries, ranks what it finds, and returns the ordered set
#   - the station computing no taste score of its own: it supplies the catalog,
#     the pooled watch history, the recently-aired tail, and a target count,
#     and takes back nothing but entry_ids in order
#   - a plugin pool composing with `pattern` / `take` / `advance: resume`
#     exactly as a CEL pool does
#   - a channel that could set a config-level replay floor and deliberately does
#     not: `constraints: no_repeat_within` on a pool (#115) is available to any
#     plugin pool and holds whatever the script does, but this scorer already
#     suppresses what it recently returned, and the two do not layer — see the
#     note on the `movies` pool (#116)
#
# Two pools, one plugin. `movies` and `shows` name the same `taste-engine.rhai`;
# the script's own `sources()` splits the library by type, and each pool draws
# the half it wants. `advance: resume` on `shows` means a show the plugin keeps
# surfacing continues through its episodes across days rather than restarting.
#
# Server-wide, deliberately. This channel says no `taste_scope`, which means
# `all_users`: the watch history handed to the plugin is pooled across every
# Tautulli account with no user dimension. That is the right default for a house
# channel on a server with 20 accounts, several shared by more than one real
# person — "alice's taste" is not a thing those accounts can support.
#
# A channel that follows one named person writes `taste_scope: single_user` plus
# `user:` under `scoring:` (#112) — a separate channel file with its own
# output_folder, not a fan-out of this one. See docs/schema.md § taste_scope.
#
# Short window on purpose. `window_days: 1` with `chunk_hours: 6` means the
# plugin re-runs before much of the schedule is written, so the ranking is at
# most hours stale when it airs. A 30-day window would rank once and air the
# result a month later, against watch history a month out of date.
#
# Registered in examples/station.yaml via the `samples/*.yaml` glob, so a
# dev-run serves it live. It resolves to nothing unless the station's
# `catalog_path` points at a populated catalog, and its ranking degrades to
# arbitrary without a reachable Tautulli. Its resolution is also proven by the
# `foryou_sample` acceptance test.
window_days: 1
roll_interval: "60s"
retention_days: 1

# How far back the plugin's replay suppression can see, and the item length used
# to size how much it is asked for. Both are this channel's taste rather than
# the daemon's, which is why they are per-channel.
scoring:
  recent_depth: 200
  nominal_item_secs: 5400

rule:
  blocks:
    - mode: "all"
      program:
        title: "For You"

      pools:
        # Movies the plugin thinks are worth surfacing right now. No `order` —
        # the plugin returns its set already ranked, and re-sorting it would
        # discard the ranking it exists to produce.
        #
        # No `constraints` here, still deliberately — but the reason has changed.
        # It is now safe to write (#115 moved the table to the pool, so it counts
        # positions in this pool's own draw order and can no longer disturb the
        # 2+3 shape). It is simply the wrong tool for this channel: `cycles` is
        # derived to drain the largest pool once, so a no-repeat rule here would
        # force every movie in the library into a single window and leave the
        # plugin's `ctx.recent` suppression nothing to hold back. Replay policy
        # on this channel therefore stays entirely in the plugin, which is the
        # only half that knows what "recently" means across generations.
        # `kungfu.yaml` is the sample that exercises the field.
        #
        # That reasoning is a bet on *this* script. `taste-engine.rhai`
        # suppresses what it recently returned; ETV does not check that any
        # plugin does, and with `advance: restart` nothing else here stops a
        # scorer that doesn't from handing back the same top-ranked film every
        # generation. Point this pool at a different script and the floor
        # becomes the thing to add — `constraints: { no_repeat_within: N }`,
        # applied to the list the plugin returned before the pattern draws from
        # it. Accept the whole-library sweep as the price, or keep the
        # suppression in the script. See #116 and ADR 0002.
        - name: movies
          plugin: "../plugins/taste-engine.rhai"
          select: round_robin
          advance: restart

        # Episodes, ranked the same way. `advance: resume` is what makes a show
        # the plugin keeps surfacing progress over days instead of replaying its
        # first three episodes every generation — the resume point is keyed on
        # `show_id`, so a show that drops out of the ranking and returns later
        # picks up where it left off.
        - name: shows
          plugin: "../plugins/taste-engine.rhai"
          select: round_robin
          rotate: visit
          advance: resume
          on_short: next

      # Two movies, then three episodes of whichever show is up.
      pattern:
        - pool: movies
          take: 2
        - pool: shows
          take: 3
