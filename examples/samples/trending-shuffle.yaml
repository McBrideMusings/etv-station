# Sample S5 — Trending: shuffle a collection, play all, reshuffle, repeat.
#
# A *query* channel that treats a Plex collection as a SET, not an order: it
# resolves every member of every collection whose name matches `^Trending`
# (membership EXISTS — `collection_items.position` is ignored here), collapses
# any accidental duplicate, then shuffles. The regex is what makes one curated
# idea addressable when Plex has split it into "Trending Movies", "Trending TV
# Shows", and so on; `matches` and `startsWith` both read the collection NAME,
# while `contains` stays an exact whole-name membership test. `order: "random"` with NO `seed` draws fresh entropy
# each generation, so every loop feels fresh; pin a `seed` to reproduce a
# shuffle. Contrast with Sample S6 (Marathon), which reads the SAME collection
# structure for its authored `position` (collections-as-order).
#
# Registered in examples/station.yaml via the `samples/*.yaml` glob, so a
# dev-run serves it live. Being a query channel it resolves to nothing
# unless the station's `catalog_path` points at a populated catalog. Its
# resolution is also proven by the `trending_shuffle_sample` acceptance test.
number: 8
display_name: "Trending"
window_days: 1
roll_interval: "60s"
retention_days: 1
# no seed → a fresh shuffle each generation

rule:
  blocks:
    - mode: "all"
      order: "random"
      duplicates: "collapse"
      program:
        title: "Trending"
        categories: ["Movie"]
      entries:
        - kind: query
          query: 'item.collections.matches("^Trending")'
