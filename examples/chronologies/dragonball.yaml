# Dragon Ball in-universe watch order, declared once so any channel can play it.
#
# Each entry has an explicit `position`; the order is the positions, not the
# line order. Gaps are deliberate: a film slotted in later takes a free number
# between its neighbours without renumbering the rest. An episode is named by
# show + season + episode, a standalone film by title (+ year). Every entry must
# match exactly one catalog item, or the channel naming this chronology fails to
# resolve and says which entry missed.
#
# Season order rather than `absolute_episode`: this library's Dragon Ball is not
# filed under an absolute-order agent, so Plex reports no `absoluteIndex` (#47).
# Season 1 is 13 episodes and season 2 is 15, the same 1-28 run.
name: dragonball
entries:
  - {position: 10, show: "Dragon Ball", season: 1, episode: 1}
  - {position: 20, show: "Dragon Ball", season: 1, episode: 2}
  - {position: 30, show: "Dragon Ball", season: 1, episode: 3}
