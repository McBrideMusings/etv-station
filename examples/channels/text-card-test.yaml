number: 60
name: text-card-test
# Text-card bumpers on a 30-minute grid: the Adult Swim-style card from
# plugins/bumpers/text_card.rhai fills the gap after each programme. Run it with
# `STATION_CONFIG=examples/station-align.yaml ./tools/dev-run.sh`.
display_name: "Text Card Test Channel"
window_days: 1
chunk_hours: 1
roll_interval: "60s"
retention_days: 1

overlay:
  file: "../../crates/etv-overlay/fixtures/channel_watermark.yaml"

rule:
  blocks:
    - mode: "all"
      order: "manual"
      align: 30m
      fill:
        - script: ../plugins/bumpers/text_card.rhai
          capabilities: [read]
      entries:
        - kind: item
          in_point: "0s"
          out_point: "7m"
          source:
            kind: lavfi
            params: "testsrc=size=1280x720:rate=30 [out0]; sine=frequency=440 [out1]"
          program:
            title: "Seven Minutes"
            categories: ["Test"]

        - kind: item
          in_point: "0s"
          out_point: "11m"
          source:
            kind: lavfi
            params: "smptebars=size=1280x720:rate=30 [out0]; sine=frequency=880 [out1]"
          program:
            title: "Eleven Minutes"
            categories: ["Test"]
