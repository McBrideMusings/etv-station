# station-align.yaml's twin for the up-next promo bumper. Run it from the repo
# root, with no Plex:
#   env -u PLEX_URL -u PLEX_TOKEN -u TAUTULLI_URL -u TAUTULLI_API_KEY \
#     ./target/debug/etv-station --config examples/station-up-next.yaml
# or `STATION_CONFIG=examples/station-up-next.yaml ./tools/dev-run.sh`.
tz: "America/Chicago"

output_base: examples/output

channels:
  - channels/up-next-test.yaml

catalog_path: tmp/catalog.db

catalog_refresh_secs: 86400

normalization:
  audio:
    format: aac
    bitrate_kbps: 192
    buffer_kbps: 384
    channels: 2
    sample_rate_hz: 48000
    normalize_loudness: false
  video:
    format: h264
    bit_depth: 8
    width: 1920
    height: 1080
    bitrate_kbps: 6000
    buffer_kbps: 12000
  subtitle:
    mode: convert
