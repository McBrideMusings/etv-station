[workspace]
members = ["crates/etv-station", "crates/etv-query-test", "crates/etv-overlay"]
exclude = ["etv-next"]
resolver = "3"

[workspace.dependencies]
ersatztv = { path = "etv-next/crates/ersatztv" }
ersatztv-core = { path = "etv-next/crates/ersatztv-core" }
ersatztv-playout = { path = "etv-next/crates/ersatztv-playout" }
etv-station = { path = "crates/etv-station" }
etv-overlay = { path = "crates/etv-overlay" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
cel = { version = "0.13", features = ["json"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
humantime = "2"
humantime-serde = "1"
nix = { version = "0.29", features = ["fs", "signal"] }
png = "0.17"
pollster = "0.4"
regex = "1"
rhai = { version = "1.20", features = ["sync", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
# Reports the keys a config file carried that the types do not know, so an
# unrecognised key can be a warning instead of a refusal to start.
serde_ignored = "0.1"
serde_json = "1"
serde_norway = "0.9"
# Dev-only: pins the SHA-256 of the identity fixture shared with plex-db-ex, so
# editing one repo's copy without the other turns both suites red (#184).
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
time-tz = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.23", features = ["v4"] }
tempfile = "3"
vello = "0.9"
wgpu = "29"
parley = "0.9"
