<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>etv-station</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --fg: #16181d; --muted: #6b7079; --line: #dfe2e7; --panel: #f6f7f9;
    --accent: #3d4fd1; --bar: #3d4fd1; --bar-open: #9aa3b1; --track: #e9ebef;
    --warn-bg: #fff6d8; --warn-fg: #6b4e00; --err-bg: #fde8e8; --err-fg: #8a1414;
    --ink-bg: #16181d; --ink-fg: #ffffff;
    --ppm: 1.15px;   /* guide height per minute of airtime */
    --col: 138px;    /* guide width per day */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121418; --fg: #e6e8ec; --muted: #9298a3; --line: #2c3038; --panel: #1b1e24;
      --accent: #8e9cff; --bar: #8e9cff; --bar-open: #5c6370; --track: #262a32;
      --warn-bg: #3a3014; --warn-fg: #f2d98a; --err-bg: #3d1c1c; --err-fg: #ffb4b4;
      --ink-bg: #e6e8ec; --ink-fg: #121418;
    }
  }
  * { box-sizing: border-box; }
  /* `hidden` must win over every `display` rule below (the toolbar is flex, the narrow picker block). */
  [hidden] { display: none !important; }
  /* The page itself never scrolls: tabs, lineup and masthead stay put, and only the lineup, the guide and the rail scroll inside it. */
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0;
    background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.4;
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

  /* The dashboard frame: a tab bar, then on Channels the lineup beside the channel's page. */
  .tabs { display: flex; align-items: center; gap: 4px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  .tabs .brand { font-weight: 800; margin-right: 12px; }
  .tabs a { padding: 4px 12px; border-radius: 3px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 13px; }
  .tabs a[aria-current="page"] { background: var(--bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1fr); }
  .app.wide { grid-template-columns: minmax(0, 1fr); }
  .lineup { border-right: 1px solid var(--line); overflow: auto; padding: 8px 0; font-size: 13px; }
  .lineup a { display: flex; gap: 8px; padding: 3px 14px; color: var(--fg); text-decoration: none; white-space: nowrap; }
  .lineup a .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
  .lineup a .nm { overflow: hidden; text-overflow: ellipsis; }
  .lineup a:hover { background: var(--panel); }
  .lineup a[aria-current="page"] { background: var(--accent); color: var(--bg); }
  .lineup a[aria-current="page"] .n { color: inherit; }
  .lineup a.broken .nm { color: var(--err-fg); }
  .lineup a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lineup .lstate { padding: 4px 14px; }
  #lineupSelect { display: none; }
  main { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 10px 20px 12px; }
  .subtabs { display: flex; gap: 2px; }
  .subtabs a { padding: 3px 10px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 600; }
  .subtabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
  .pattern-page { max-width: 760px; }
  .empty { max-width: 520px; margin: 40px auto; text-align: center; }
  .empty h1 { font-size: 20px; margin: 0 0 6px; }
  a { color: var(--accent); }
  h2 { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; margin-bottom: 10px; }
  .toolbar .spacer { flex: 1; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; }
  button:disabled { opacity: .45; cursor: default; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  #projState { min-width: 0; }
  #state { min-height: 18px; }
  .spinner { display: inline-block; width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px;
    border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #report { transition: opacity .15s ease; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
  #report.loading { opacity: .35; pointer-events: none; }
  .notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: 3px; padding: 4px 10px; margin-top: 6px; font-size: 12.5px; }
  .error { background: var(--err-bg); color: var(--err-fg); border-radius: 3px; padding: 10px 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12.5px; }

  /* Masthead: channel number, name, span and pattern, and the four numbers in one row. */
  .mast { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center;
    padding-bottom: 10px; border-bottom: 2px solid var(--fg); margin-bottom: 10px; }
  .mast .bug { font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; border: 2px solid var(--fg); border-radius: 3px; padding: 2px 8px; }
  .mast h1 { font-size: 22px; margin: 0; }
  .mast .sub { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .mast .pattern { font-size: 13px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .mast .pstub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--muted); }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: 13px; flex: none; }
  .mast .notes { grid-column: 1 / -1; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0; }
  .facts dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .facts dd { margin: 0; font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .facts dd.d { font-size: 11.5px; font-weight: 400; color: var(--muted); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 900px) { .mast { grid-template-columns: auto minmax(0, 1fr); } .facts { grid-column: 1 / -1; } }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; margin: 0 0 8px; align-items: center; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 1px; margin-right: 5px; vertical-align: -1px; }
  .pin { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%;
    background: var(--ink-bg); color: var(--ink-fg); font-size: 10.5px; font-weight: 700; margin-right: 5px; flex: none; }
  .rbadge { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; border-radius: 2px;
    background: var(--ink-bg); color: var(--ink-fg); font-size: 10px; font-weight: 800; margin-right: 5px; padding: 0 2px; }
  .hatch { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.13) 0 4px, transparent 4px 8px); }
  /* Projected, not scheduled: a dashed edge and a crosshatch no repeat marker uses. */
  .blk.proj { border: 1px dashed var(--fg); opacity: .8;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0 3px, transparent 3px 7px), repeating-linear-gradient(135deg, rgba(255,255,255,.5) 0 3px, transparent 3px 7px); }
  .swatch.proj { width: 14px; height: 10px; background-color: var(--track); border: 1px dashed var(--fg); }
  .frontier { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--err-fg); z-index: 1; pointer-events: none; }
  .frontier span { position: absolute; right: 2px; top: 1px; font-size: 9.5px; font-weight: 700; color: var(--err-fg); background: var(--bg); padding: 0 3px; border-radius: 2px; }
  .swatch.fl { height: 0; width: 14px; border-top: 2px solid var(--err-fg); background: none; vertical-align: 3px; }
  .tag-proj { font-size: 11px; font-weight: 700; border: 1px dashed var(--fg); border-radius: 2px; padding: 0 5px; }

  /* Guide first: a column per day, time running down, block height = running time. Side rail holds the numbers. */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; }
  .gwrap { overflow: auto; min-height: 0; border: 1px solid var(--line); }
  /* max-content, so the sticky hour gutter's containing block spans every day column, not just the viewport. */
  .wk { display: grid; grid-template-columns: 44px repeat(var(--n), var(--col)); width: max-content; }
  .colhead { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 2px solid var(--fg); border-left: 1px solid var(--line);
    font-weight: 700; font-size: 12px; padding: 4px 6px; white-space: nowrap; }
  .corner { position: sticky; top: 0; left: 0; z-index: 4; background: var(--bg); border-bottom: 2px solid var(--fg); }
  .gutter { position: sticky; left: 0; z-index: 2; background: var(--bg); height: calc(1440 * var(--ppm)); }
  .gutter span { position: absolute; right: 4px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; transform: translateY(-50%); }
  .col { position: relative; height: calc(1440 * var(--ppm)); border-left: 1px solid var(--line);
    background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(60 * var(--ppm))); }
  .blk { position: absolute; left: 2px; right: 2px; border-radius: 2px; overflow: hidden; color: #111; font-size: 11px; line-height: 1.2;
    padding: 2px 4px; border: 1px solid rgba(0,0,0,.2); outline: none; }
  /* An inset outline, never box-shadow or z-index: changing a block's stacking repaints the whole grid on every hover. */
  .blk:focus-visible, .blk:hover { outline: 2px solid var(--fg); outline-offset: -2px; }
  .blk.tiny { padding: 0; border-width: 0 0 1px; }
  .blk .tm { font-variant-numeric: tabular-nums; opacity: .7; font-size: 10px; }
  .blk > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk b { font-weight: 700; }
  .blk .pin, .blk .rbadge { width: 14px; height: 14px; min-width: 14px; font-size: 9px; margin-right: 3px; vertical-align: 1px; }
  .blk .rbadge { background: #16181d; color: #fff; }

  .rail { min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .rail section { border-top: 1px solid var(--fg); padding: 6px 0 14px; min-width: 0; }
  .samples { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sample { min-width: 0; font-size: 11.5px; }
  .sample .still, .sample .still-missing { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); margin-bottom: 4px; }
  .sample .still { object-fit: contain; }
  .sample .still-missing { display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px;
    color: var(--muted); background: var(--track); font-size: 11.5px; }
  .sample .when { color: var(--muted); display: flex; align-items: center; }
  .sample .what { font-weight: 600; margin: 2px 0 3px; }
  .sample .prog { height: 4px; background: var(--track); overflow: hidden; }
  .sample .prog span { display: block; height: 100%; background: var(--accent); }
  .sample ol { margin: 3px 0 0; padding: 0; list-style: none; color: var(--muted); }

  /* The selected-item panel at the top of the rail: an airing's selection trail, or the channel's pattern. */
  .blk { cursor: pointer; }
  .blk.sel { outline: 3px solid var(--fg); outline-offset: -3px; }
  .rail section.insp { border-top: 2px solid var(--fg); background: var(--panel); padding: 8px 10px 12px; margin-bottom: 4px; }
  .insp h3 { font-size: 15px; margin: 0; }
  .insp .ep { color: var(--muted); font-size: 12.5px; }
  .insp .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .insp h4 { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
  .insp .stage { border-left: 2px solid var(--fg); padding: 2px 0 4px 8px; margin-bottom: 6px; font-size: 12px; }
  .insp .stage .hd { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .insp .chip { font-family: ui-monospace, monospace; font-size: 10.5px; padding: 0 4px; border: 1px solid var(--line); border-radius: 2px; }
  .insp dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 8px; margin: 3px 0 0; font-size: 11.5px; }
  .insp dl.kv dt { color: var(--muted); }
  .insp dl.kv dd { margin: 0; font-family: ui-monospace, monospace; font-size: 11px; overflow-wrap: anywhere; }
  .insp ol.hist { margin: 0; padding: 0; list-style: none; font-size: 12px; font-variant-numeric: tabular-nums; }
  .insp ol.hist li.me { font-weight: 700; }
  .insp .sum { font-size: 12px; color: var(--muted); }
  .insp .x { float: right; border: 0; background: none; font-size: 16px; line-height: 1; padding: 0 2px; }
  .insp table.steps td { font-size: 12px; }

  .ptotal { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .ptotal .big { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.principles td { vertical-align: top; padding: 3px 4px; }
  table.principles .pname { font-weight: 600; width: 34%; }
  table.principles .dots { white-space: nowrap; letter-spacing: 1px; font-size: 11px; }
  table.principles .pmeasure { font-size: 11.5px; }
  table.principles tr.unscored .pname { color: var(--muted); font-weight: 500; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 2px 5px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.show td.name { padding-left: 20px; }
  tr.pool td.name { font-weight: 600; }
  .bar { position: relative; height: 8px; background: var(--track); min-width: 40px; }
  .bar span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); }
  .bar span.open { background: var(--bar-open); }
  .overlap-row { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .overlap-row summary { cursor: pointer; }
  .overlap-row .titles { margin: 4px 0 2px 16px; font-size: 12px; color: var(--muted); }
  .old { color: var(--muted); }
  .changed .new { font-weight: 650; }

  @media (max-width: 900px) {
    :root { --col: 120px; }
    /* Too narrow to lock: the page scrolls, the guide keeps its own scroll box above the rail. */
    body { height: auto; overflow: visible; display: block; }
    /* The lineup folds into a picker above the channel's page. */
    .app { display: block; }
    .lineup { display: none; }
    #lineupSelect { display: block; margin: 10px 20px 0; max-width: calc(100% - 40px); }
    main { padding: 10px 16px; }
    #report { display: block; overflow: visible; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .gwrap { height: 70vh; }
    .rail { overflow: visible; }
  }

  /* Guide: a row per channel, time running across, programme width = running time. */
  .gsrc { color: var(--muted); font-size: 12px; margin-left: auto; }
  .gtool { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .tg { position: relative; width: max-content; }
  .tg-head, .tg-row { display: flex; }
  .tg-head { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 2px solid var(--fg); height: 22px; }
  .tg-corner, .tg-ch { position: sticky; left: 0; z-index: 2; width: var(--chw); flex: none; background: var(--bg); }
  .tg-ch { padding: 0 8px; line-height: 26px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--line); }
  .tg-ch .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .tg-times { position: relative; flex: none; }
  .tg-times span { position: absolute; top: 4px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 4px; border-left: 1px solid var(--line); height: 18px; }
  .tg-track { position: relative; flex: none; height: 26px; border-bottom: 1px solid var(--line);
    background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(30 * var(--gppm))); }
  .pgm { position: absolute; top: 2px; height: 22px; border-radius: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); font-size: 11.5px; line-height: 20px; padding: 0 5px; cursor: pointer; outline: none; }
  .pgm.live { border-color: var(--accent); }
  .pgm:hover, .pgm:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  .pgm.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
  .tg-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 1; pointer-events: none; }
  .gnote { margin-top: 8px; }
  .tg-ch.watch { cursor: pointer; }
  .tg-ch.watch:hover, .tg-ch.watch:focus-visible, .tg-ch.playing { outline: 2px solid var(--accent); outline-offset: -2px; }
  .player { border: 1px solid var(--line); margin-bottom: 12px; padding: 8px; }
  .player video { width: 100%; background: #000; display: block; aspect-ratio: 16 / 9; }
  .player h3 { margin: 0 0 2px; font-size: 14px; }
  .player .now { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .player .x { float: right; }
  .insp .err { margin-top: 8px; }
  /* Graphics: a list of scripts beside the result of the last render. */
  .gscripts { min-height: 0; overflow: auto; }
  .gscripts section { margin-bottom: 14px; }
  .grow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .grow .gname { flex: 1 1 240px; min-width: 0; }
  .grow .gpath { overflow-wrap: anywhere; }
  .grow input { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 5px; width: 5em; }
  .grow input.ggap { width: 6em; }
  .gmedia { display: block; width: 100%; background: #000; aspect-ratio: 16 / 9; object-fit: contain; border: 1px solid var(--line); }
  #tip { position: fixed; z-index: 10; max-width: 360px; background: var(--fg); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 3px; pointer-events: none; }
</style>
</head>
<body>
<nav class="tabs" aria-label="Dashboard">
  <span class="brand">etv-station</span>
  <a id="tabChannels" href="#/channels">Channels</a>
  <a id="tabGuide" href="#/guide">Guide</a>
  <a id="tabHealth" href="#/health">Health</a>
  <span class="spacer" style="flex:1"></span>
  <a href="/tune">Tune</a>
</nav>
<div class="app" id="app">
  <nav class="lineup" id="lineup" aria-label="Channels"><div class="lstate muted">Loading the lineup…</div></nav>
  <main>
    <select id="lineupSelect" aria-label="Channel"></select>
    <div class="toolbar" id="toolbar">
      <nav class="subtabs" aria-label="Channel views">
        <a id="subSchedule" href="#">Schedule</a>
        <a id="subPattern" href="#">Pattern</a>
        <a id="subGraphics" href="#">Graphics</a>
      </nav>
      <span id="position" class="muted"></span>
      <span class="spacer"></span>
      <span id="projState" class="muted" aria-live="polite"></span>
      <span class="muted" id="projLabel">Project ahead</span>
      <span class="seg" role="group" aria-labelledby="projLabel" id="projBtns">
        <button type="button" data-project="1d" aria-pressed="false">+1d</button>
        <button type="button" data-project="3d" aria-pressed="false">+3d</button>
        <button type="button" data-project="7d" aria-pressed="false">+7d</button>
        <button type="button" data-project="14d" aria-pressed="false">+14d</button>
      </span>
      <button id="projClear" type="button">Real only</button>
    </div>
    <div id="state" class="muted"></div>
    <div id="report"></div>
  </main>
</div>
<div id="tip" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// One hue per pool, in first-airing order; light enough that dark text reads on it in both themes.
const POOL_COLORS = ['#a9c4ff', '#ffc98f', '#a8e0b4', '#f4a9c8', '#d3b8ff', '#ffe08a', '#9fe3e0', '#e0c3a3'];
// The guide opens scrolled to this hour, so the afternoon and evening fill the first screen.
const GUIDE_OPEN_HOUR = 12;

// A 202 poll gives up after this long and shows an error instead of spinning.
const POLL_DEADLINE_MS = 600000;
let current = null;   // the last channel review payload
let lineup = null;    // GET /api/lineup's channels, once loaded
let loadSeq = 0;  // a newer load() supersedes an older one still polling

// The view lives in the hash, using the API's own nouns: `#/channels/{key}/{schedule|pattern|graphics}?project=Nd`,
// `#/guide`, `#/health`. A key holding a `/` (an examples/ channel) is percent-encoded.
function parseRoute() {
  const [path, qs] = location.hash.replace(/^#/, '').split('?');
  const parts = path.split('/').filter(Boolean);
  const q = new URLSearchParams(qs || '');
  const tab = ['channels', 'guide', 'health'].includes(parts[0]) ? parts[0] : 'channels';
  return {
    tab,
    channel: tab === 'channels' && parts[1] ? decodeURIComponent(parts[1]) : null,
    view: ['pattern', 'graphics'].includes(parts[2]) ? parts[2] : 'schedule',
    project: ['1d', '3d', '7d', '14d'].includes(q.get('project')) ? q.get('project') : null,
  };
}
function channelHash(channel, view, project) {
  return `#/channels/${encodeURIComponent(channel)}/${view || 'schedule'}${project ? `?project=${project}` : ''}`;
}

function fmt(ts, tz, opts) {
  return new Date(ts * 1000).toLocaleString('en-US', { timeZone: tz, ...opts });
}
const timeOf = (ts, tz) => fmt(ts, tz, { hour: 'numeric', minute: '2-digit' });
const dayOf = (ts, tz) => fmt(ts, tz, { weekday: 'short', month: 'short', day: 'numeric' });
const days1 = (d) => (Math.round(d * 10) / 10).toFixed(1);
const hourLabel = (h) => (h === 0 ? '12a' : h < 12 ? h + 'a' : h === 12 ? '12p' : (h - 12) + 'p');

// Fetches the channel's review. The real schedule answers at once and is drawn; while a requested
// projection runs the server answers 202 with that same real review, so the page asks again every
// second beside a spinner and redraws with the projection when it lands.
async function load(channel, project, view) {
  const q = new URLSearchParams();
  if (project) q.set('project', project);
  const began = Date.now();
  const projecting = () => {
    $('projState').innerHTML = `<span class="spinner"></span>Projecting ${esc(project.replace('d', ''))} day${project === '1d' ? '' : 's'}… (${Math.round((Date.now() - began) / 1000)}s)`;
  };
  $('state').textContent = '';
  $('projState').textContent = '';
  // Another channel's report never stays on screen under this one's load; the same channel's dims while it reloads.
  if (!current || current.channel !== channel) { current = null; $('report').innerHTML = ''; }
  $('report').classList.add('loading');
  setControls(project, true);
  const seq = ++loadSeq;
  const deadline = Date.now() + POLL_DEADLINE_MS;
  let data;
  let drewReal = false;
  try {
    for (;;) {
      const res = await fetch(`/api/channels/${encodeURIComponent(channel)}/review?${q}`);
      data = await res.json();
      if (seq !== loadSeq) return;
      if (!res.ok) data = { error: `HTTP ${res.status}: ${data.error || 'no error message'}` };
      if (!data.pending) break;
      if (!drewReal) { $('report').classList.remove('loading'); show(data, view); drewReal = true; }
      if (Date.now() > deadline) throw new Error(`still projecting after ${POLL_DEADLINE_MS / 1000}s; reload to keep waiting`);
      projecting();
      await new Promise((r) => setTimeout(r, 1000));
      if (seq !== loadSeq) return;
    }
  } catch (e) {
    data = { error: String(e) };
  }
  if (seq !== loadSeq) return;
  $('report').classList.remove('loading');
  $('projState').textContent = '';
  setControls(project, false);
  $('state').textContent = '';
  if (data.error) {
    current = null;
    $('report').innerHTML = `<header class="mast"><h1>${esc(channel)}</h1></header>
      <h2>The review could not be built</h2><div class="error">${esc(data.error)}</div>`;
    return;
  }
  show(data, view);
}

// Draws one review payload, or the load-error page for a channel whose config fails to load.
function show(data, view) {
  if (data.load_error) {
    current = null;
    document.title = `etv-station · ${data.channel}`;
    $('report').innerHTML = `<header class="mast"><div><h1>${esc(data.channel)}</h1>
      <div class="sub">${esc(data.config_path)}</div></div></header>
      <h2>This channel's config fails to load</h2><div class="error">${esc(data.load_error)}</div>`;
    return;
  }
  // Per-item catalog fields arrive once per entry id in `items`; merge them onto each airing.
  for (const a of data.airings) Object.assign(a, data.items[a.id]);
  current = data;
  draw(view);
}

// The Project ahead buttons: the pressed one is the length on screen; all stay off while a load is in flight.
function setControls(project, busy) {
  for (const b of $('projBtns').querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.project === project));
    b.disabled = busy;
  }
  $('projClear').disabled = busy || !project;
}

function draw(view) {
  if (view === 'pattern') renderPattern(current); else render(current);
}

// The lineup rail: every channel in station.yaml order as "number name"; one that failed to load shows its key in red.
async function loadLineup() {
  let data;
  try {
    const res = await fetch('/api/lineup');
    data = await res.json();
    if (!res.ok) data = { error: `HTTP ${res.status}: ${data.error || 'no error message'}` };
  } catch (e) {
    data = { error: String(e) };
  }
  if (data.error) {
    $('lineup').innerHTML = `<div class="lstate error">${esc(data.error)}</div>`;
    return;
  }
  lineup = data.channels;
  if (!lineup.length) {
    $('lineup').innerHTML = '<div class="lstate muted">The station lists no channels.</div>';
    return;
  }
  $('lineup').innerHTML = lineup.map((c) => `<a data-key="${esc(c.channel)}" class="${c.error ? 'broken' : ''}"
      title="${esc(c.error ? `${c.channel}: ${c.error}` : c.channel)}">
      <span class="n">${esc(c.number ?? '—')}</span><span class="nm">${esc(c.display_name || c.channel)}</span></a>`).join('');
  $('lineupSelect').innerHTML = lineup.map((c) =>
    `<option value="${esc(c.channel)}">${esc(c.number == null ? c.channel : `${c.number} · ${c.display_name || c.channel}`)}</option>`).join('');
}

// Marks where the page is: the tab, the channel in the lineup, the sub-tab, and the links that keep the days.
function markRoute(r) {
  for (const [id, tab] of [['tabChannels', 'channels'], ['tabGuide', 'guide'], ['tabHealth', 'health']]) {
    if (r.tab === tab) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current');
  }
  $('app').classList.toggle('wide', r.tab !== 'channels');
  $('lineup').hidden = r.tab !== 'channels';
  $('lineupSelect').hidden = r.tab !== 'channels';
  $('toolbar').hidden = r.tab !== 'channels';
  setControls(r.project, false);
  // Project ahead belongs to the schedule; Graphics has no projection to ask for.
  const projecting = r.tab === 'channels' && r.view !== 'graphics';
  for (const id of ['projState', 'projLabel', 'projBtns', 'projClear']) $(id).hidden = !projecting;
  if (r.tab !== 'channels' || !lineup) return;
  const project = r.project;
  for (const a of $('lineup').querySelectorAll('a')) {
    a.href = channelHash(a.dataset.key, r.view, project);
    if (a.dataset.key === r.channel) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  $('lineupSelect').value = r.channel;
  for (const [id, view] of [['subSchedule', 'schedule'], ['subPattern', 'pattern'], ['subGraphics', 'graphics']]) {
    $(id).href = channelHash(r.channel, view, project);
    if (r.view === view) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current');
  }
  const i = lineup.findIndex((c) => c.channel === r.channel);
  $('position').textContent = i < 0 ? '' : `${i + 1} of ${lineup.length} in station.yaml order`;
  const sel = $('lineup').querySelector('[aria-current="page"]');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

// Health has no content yet: say so rather than show an empty frame.
function renderEmpty(tab) {
  current = null;
  document.title = 'etv-station · Health';
  $('state').textContent = '';
  $('report').classList.remove('loading');
  $('report').innerHTML = `<div class="empty"><h1>Health</h1>
    <p class="muted">Not built yet. It will show each channel's encoder, failures and last stall.</p></div>`;
}

let shown = null;   // the channel and projection the report holds, so a sub-tab switch redraws without refetching
async function route() {
  const r = parseRoute();
  if (!lineup) await loadLineup();
  if (r.tab === 'channels' && !r.channel) {
    // A bare `#/channels` (or no hash) opens the first channel in the lineup.
    if (lineup && lineup.length) { location.replace(channelHash(lineup[0].channel, 'schedule', r.project)); return; }
  }
  markRoute(r);
  stopPlayer();
  if (r.tab !== 'channels' || r.view !== 'graphics') { gSeq++; renderSeq++; }
  if (r.tab === 'guide') { loadSeq++; shown = null; current = null; document.title = 'etv-station · Guide'; $('state').textContent = ''; $('report').classList.remove('loading'); loadGuide(); return; }
  if (r.tab !== 'channels') { loadSeq++; guideSeq++; shown = null; renderEmpty(r.tab); return; }
  if (!r.channel) return;
  guideSeq++;
  if (r.view === 'graphics') { loadSeq++; shown = null; current = null; loadGraphics(r.channel); return; }
  const key = `${r.channel}|${r.project}`;
  if (shown === key && current) { draw(r.view); return; }
  shown = key;
  await load(r.channel, r.project, r.view);
}

// Channels › Graphics: the overlay and bumper scripts the channel names, each rendered on request.
// A render is queued (POST), then asked for again every GRAPHICS_POLL_MS until it is done or failed.
const GRAPHICS_POLL_MS = 2000;
let gSeq = 0;      // a newer Graphics load or render supersedes an older one still polling
let renderSeq = 0; // a newer render request supersedes the one still polling

async function loadGraphics(channel) {
  const seq = ++gSeq;
  document.title = `etv-station · ${channel} · Graphics`;
  $('state').textContent = '';
  $('report').classList.remove('loading');
  $('report').innerHTML = '<div class="muted">Loading the channel’s scripts…</div>';
  let data;
  try {
    const res = await fetch(`/api/channels/${encodeURIComponent(channel)}/graphics`);
    data = await res.json();
    if (!res.ok) data = { error: `HTTP ${res.status}: ${data.error || 'no error message'}` };
  } catch (e) {
    data = { error: String(e) };
  }
  if (seq !== gSeq) return;
  if (data.error) {
    $('report').innerHTML = `<header class="mast"><h1>${esc(channel)}</h1></header>
      <h2>Graphics could not be listed</h2><div class="error">${esc(data.error)}</div>`;
    return;
  }
  if (data.load_error) {
    $('report').innerHTML = `<header class="mast"><div><h1>${esc(data.channel)}</h1>
      <div class="sub">${esc(data.config_path)}</div></div></header>
      <h2>This channel's config fails to load</h2><div class="error">${esc(data.load_error)}</div>`;
    return;
  }
  drawGraphics(data);
}

function drawGraphics(d) {
  const canvas = d.canvas ? `${d.canvas.width}×${d.canvas.height}` : 'no overlay canvas';
  const overlayRows = d.overlays.map((o) => `<div class="grow" data-script="${esc(o.script)}">
      <div class="gname"><b>${esc(o.name)}</b><div class="muted gpath">${esc(o.script)}</div></div>
      <label class="muted">at <input type="number" class="gat" min="0" max="3600" step="0.5" value="0"> s</label>
      <button type="button" data-kind="still">Still</button>
      <button type="button" data-kind="clip">Clip</button></div>`).join('');
  const bumperRows = d.bumpers.map((b) => {
    const range = [b.min_gap && `min ${b.min_gap}`, b.max_gap && `max ${b.max_gap}`].filter(Boolean).join(', ');
    return `<div class="grow" data-script="${esc(b.script)}">
      <div class="gname"><b>${esc(b.name)}</b><div class="muted gpath">${esc(b.script)}${range ? ` · ${esc(range)}` : ''}</div></div>
      <label class="muted">gap <input type="text" class="ggap" size="6" value="${esc(d.default_gap)}"></label>
      <button type="button" data-kind="bumper">Render</button></div>`;
  }).join('');
  $('report').innerHTML = `<header class="mast"><div><h1>${esc(d.channel)}</h1>
      <div class="sub">Graphics · rendered with the station's renderer at ${esc(canvas)}</div></div></header>
    <div class="layout"><div class="gscripts">
      <section><h2>Overlays</h2>${overlayRows || '<p class="muted">This channel’s overlay names no script.</p>'}</section>
      <section><h2>Bumpers</h2>${bumperRows || '<p class="muted">This channel’s blocks have no <code>fill:</code> bumper scripts.</p>'}</section>
    </div><aside class="rail"><section class="insp" id="gresult"><p class="muted">Pick Still, Clip or Render. Renders run one at a time and are kept until a script or config they read changes.</p></section></aside></div>`;
  for (const btn of $('report').querySelectorAll('.grow button')) {
    btn.addEventListener('click', () => {
      const row = btn.closest('.grow');
      const body = { kind: btn.dataset.kind, script: row.dataset.script };
      if (body.kind === 'still') body.at = Number(row.querySelector('.gat').value) || 0;
      if (body.kind === 'bumper') body.gap = row.querySelector('.ggap').value.trim();
      requestRender(d.channel, body, row.querySelector('b').textContent);
    });
  }
}

async function requestRender(channel, body, name) {
  const seq = ++renderSeq;
  const panel = $('gresult');
  const title = `<h3>${esc(name)} · ${esc(body.kind)}</h3>`;
  const fail = (what, log) => {
    if (seq !== renderSeq) return;
    panel.innerHTML = `${title}<div class="error">${esc(what)}</div>${log ? `<h4>Renderer output</h4><div class="error">${esc(log)}</div>` : ''}`;
  };
  panel.innerHTML = `${title}<div class="muted"><span class="spinner"></span>Queuing…</div>`;
  let id;
  try {
    const res = await fetch(`/api/channels/${encodeURIComponent(channel)}/graphics/render`, { method: 'POST', body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok && res.status !== 202) { fail(`HTTP ${res.status}: ${data.error || 'no error message'}`); return; }
    id = data.render;
  } catch (e) { fail(String(e)); return; }
  const began = Date.now();
  for (;;) {
    let res, data;
    try {
      res = await fetch(`/api/renders/${encodeURIComponent(id)}`);
      data = await res.json();
    } catch (e) { fail(String(e)); return; }
    if (seq !== renderSeq) return;
    if (!res.ok && res.status !== 202) { fail(`HTTP ${res.status}: ${data.error || 'no error message'}`); return; }
    if (data.state === 'failed') { fail(data.error, data.log); return; }
    if (data.state === 'done') { showRender(panel, title, data); return; }
    panel.innerHTML = `${title}<div class="muted"><span class="spinner"></span>Rendering… (asked again every ${GRAPHICS_POLL_MS / 1000}s) ${Math.round((Date.now() - began) / 1000)}s</div>`;
    await new Promise((r) => setTimeout(r, GRAPHICS_POLL_MS));
    if (seq !== renderSeq) return;
  }
}

function showRender(panel, title, r) {
  const media = r.kind === 'still'
    ? `<img class="gmedia" src="${esc(r.url)}" alt="${esc(r.kind)} of ${esc(r.script)}">`
    : `<video class="gmedia" src="${esc(r.url)}" controls autoplay muted loop playsinline></video>`;
  const facts = [`${r.width}×${r.height}`, r.duration == null ? null : `${Number(r.duration).toFixed(2)} s`].filter(Boolean).join(' · ');
  panel.innerHTML = `${title}${media}<div class="meta"><span>${esc(facts)}</span></div>
    <details><summary class="muted">Renderer output</summary><div class="error">${esc(r.log || '(none)')}</div></details>`;
}

function poolColor(d) {
  const map = {};
  let i = 0;
  // Past the palette, step round the hue wheel by the golden angle so no two pools share a colour.
  for (const a of d.airings) {
    if (a.pool in map) continue;
    map[a.pool] = i < POOL_COLORS.length ? POOL_COLORS[i] : `hsl(${Math.round((i * 137.5) % 360)} 70% 78%)`;
    i++;
  }
  return map;
}

// An airing whose item already aired earlier in the span is a repeat; `repeat_of` is the first airing's index.
function markRepeats(d) {
  const first = {};
  for (const a of d.airings) {
    if (a.id in first) a.repeat_of = first[a.id];
    else first[a.id] = a.index;
  }
}

// The block's headline and second line: a series by its show, a film by its title and year.
function headline(a) { return a.kind === 'episode' ? (a.show || a.label) : (a.title || a.label); }
function subline(a) {
  if (a.kind !== 'episode') return a.year ? String(a.year) : '';
  const se = a.season != null && a.episode != null
    ? `S${String(a.season).padStart(2, '0')}E${String(a.episode).padStart(2, '0')}` : '';
  return [se, a.title].filter(Boolean).join(' · ');
}

// What each input of a projection's cache key is called on the page.
const INPUT_WORDS = {
  config: 'the channel file', scripts: 'a plugin script or datastore', station: 'station.yaml',
  frontier: 'the state it starts from (.resume or recent airings)', candidates: 'the channel\'s candidate set',
  simulator: 'the simulator revision',
};

function notesHTML(d) {
  const notes = [];
  if (!d.airings.length) notes.push('<div class="notice">No published playout for this channel yet.</div>');
  const changed = (d.projection && d.projection.changed) || [];
  if (changed.length) {
    notes.push(`<div class="notice" id="projChanged">Projection recomputed: ${changed.map((c) => esc(INPUT_WORDS[c] || c)).join(', ')} changed since the previous projection of this length.</div>`);
  }
  if (d.projection && d.projection.error) {
    notes.push(`<div class="error">The projection failed: ${esc(d.projection.error)}</div>`);
  }
  for (const n of d.notices) notes.push(`<div class="notice">Simulator gap: ${esc(n)}</div>`);
  return notes.length ? `<div class="notes">${notes.join('')}</div>` : '';
}

function render(d) {
  document.title = `etv-station · ${d.number} ${d.display_name || d.name}`;
  const colors = poolColor(d);
  markRepeats(d);
  const tz = d.tz;
  const span = d.days;
  const covers = d.span.label;   // "real only" or "real + N days projected"; every number below is over it
  const html = [];

  // 1. Masthead
  const fr = d.first_repeat;
  const ov = d.overlap.channels;
  const largest = ov[0];
  html.push(`<header class="mast">
    <div class="bug">${esc(d.number)}</div>
    <div>
      <h1>${esc(d.display_name || d.name)}</h1>
      <div class="sub">${esc(dayOf(d.start, tz))} – ${esc(dayOf(d.end - 1, tz))} · ${esc(covers)} (${esc(tz)}) · seed ${esc(d.seed ?? 'none')} · ${esc(d.config_path)}</div>
      <div class="pattern"><button type="button" class="linkish" id="patternBtn">Pattern</button><span class="pstub" title="${esc(patternWords(d.blocks))}">${esc(patternWords(d.blocks))}</span></div>
    </div>
    <dl class="facts">
      <div><dt>First repeat</dt><dd>${fr ? days1(fr.days) + ' d' : '&gt;' + span + ' d'}</dd>
        <dd class="d" title="${esc(fr ? fr.label : '')}">${fr ? esc(fr.label) : `Nothing repeated in ${esc(covers)}`}</dd></div>
      <div><dt>Film / series airtime</dt><dd>${Math.round(d.airtime.film_share * 100)}% / ${Math.round(d.airtime.series_share * 100)}%</dd>
        <dd class="d">${Math.round(d.airtime.total_secs / 3600)} h of airtime</dd></div>
      <div><dt>Channels sharing content</dt><dd>${d.overlap.this_channel_whole_library ? '—' : ov.length}</dd>
        <dd class="d" title="${esc(largest ? `${largest.number} ${largest.display_name || largest.channel} (${largest.shared})` : '')}">${d.overlap.this_channel_whole_library ? 'Draws from the whole library'
          : largest ? `Largest: ${esc(largest.number)} ${esc(largest.display_name || largest.channel)} (${largest.shared})` : 'None share an item'}</dd></div>
      <div><dt>Items aired</dt><dd>${d.items_aired}</dd><dd class="d">${d.distinct_items} distinct · ${esc(covers)}</dd></div>
    </dl>
    ${notesHTML(d)}
  </header>`);

  html.push(`<div class="legend">${Object.entries(colors).map(([p, c]) => `<span><span class="swatch" style="background:${c}"></span>${esc(p)}</span>`).join('')}
    <span><span class="rbadge">R</span>already aired earlier in the span</span>
    <span><span class="swatch proj"></span>Projected — not scheduled</span>
    <span><span class="swatch fl"></span>Frontier: where the published playout ends</span>
    <span><span class="pin">1</span>tune-in sample</span></div>`);

  // 2. Guide, with the rail beside it
  html.push(`<div class="layout"><div class="gwrap" id="gwrap"><div class="wk" id="guide" style="--n:${d.day_starts.length - 1}"></div></div><aside class="rail" id="rail"><section class="insp" id="insp" hidden></section>`);

  // Tune-in samples, built here and placed last in the rail (7).
  const samples = d.samples.map((s) => {
    const a = d.airings[s.index];
    const next = s.next.map((i) => d.airings[i]).map((n) => `<li>${esc(timeOf(n.start, tz))} ${esc(n.label)}</li>`).join('');
    const pct = s.minutes_total ? Math.min(100, (s.minutes_in / s.minutes_total) * 100) : 0;
    const still = s.still && s.still.url
      ? `<a href="${esc(s.still.url)}" target="_blank"><img class="still" src="${esc(s.still.url)}" alt="Sample ${s.n}: ${esc(a.label)}"
          onerror="this.parentNode.outerHTML='<div class=&quot;still-missing&quot;>Still failed to render</div>'"></a>`
      : `<div class="still-missing" title="${esc((s.still && s.still.path) || '')}">${esc((s.still && s.still.unavailable) || 'No still')}</div>`;
    return `<div class="sample">${still}<div class="when"><span class="pin">${s.n}</span>${esc(dayOf(s.at, tz))} ${esc(timeOf(s.at, tz))}</div>
      <div class="what">${esc(a.label)}</div>
      <div class="prog"><span style="width:${pct}%"></span></div>
      <div class="muted">${s.minutes_in} of ${s.minutes_total} min in · ${esc(a.pool)}</div>
      <ol>${next}</ol></div>`;
  }).join('');
  const samplesSection = `<section><h2>Tune-in samples</h2>
    <p class="muted">${d.samples.length} moments drawn from seed ${esc(d.seed ?? 0)}: what is on, how far in, and the next two. Each still is the frame at that moment with the overlay as it looks when it names what is next.</p>
    <div class="samples">${samples}</div></section>`;

  // 3. Principles: graded where the schedule measures them, listed with the reason where it cannot.
  const scored = d.principles.filter((p) => p.grade != null);
  const points = scored.reduce((t, p) => t + p.grade, 0);
  const principleRows = d.principles.map((p) => p.grade != null
    ? `<tr><td class="pname">${esc(p.name)}</td><td class="dots" aria-label="${p.grade} of 3">${'●'.repeat(p.grade)}${'○'.repeat(3 - p.grade)}</td>
        <td class="pmeasure">${esc(p.measure)}</td></tr>`
    : `<tr class="unscored"><td class="pname">${esc(p.name)}</td><td class="dots">—</td>
        <td class="pmeasure">${p.measure ? esc(p.measure) + '<br>' : ''}<span class="muted">Not scored: ${esc(p.not_scored)}</span></td></tr>`).join('');
  html.push(`<section><h2>Programming principles</h2>
    <div class="ptotal"><span class="big">${points} / ${scored.length * 3}</span>
      <span class="muted">${scored.length} of ${d.principles.length} principles measured over ${esc(covers)}. Thresholds are in docs/programming.md under each principle's Grade.</span></div>
    <table class="principles"><tbody>${principleRows}</tbody></table></section>`);

  // 4. Depth
  const depthRows = d.depth.map((r) => {
    const days = r.first_repeat_days;
    const pct = days == null ? 100 : Math.min(100, (days / span) * 100);
    const value = days == null ? `&gt;${span} d` : `${days1(days)} d`;
    const swatch = r.kind === 'pool' ? `<span class="swatch" style="background:${colors[r.name] || '#ccc'}"></span>` : '';
    const tip = r.first_repeat_label ? ` title="First repeat: ${esc(r.first_repeat_label)}"` : '';
    return `<tr class="${r.kind}"${tip}><td class="name">${swatch}${esc(r.name)}</td>
      <td class="num">${r.aired} / ${r.distinct}</td>
      <td style="width:30%"><div class="bar"><span class="${days == null ? 'open' : ''}" style="width:${pct}%"></span></div></td>
      <td class="num">${value}</td></tr>`;
  }).join('');
  html.push(`<section><h2>Depth</h2>
    <p class="muted">Days from the start of the span until each pool or show first airs something a second time, over ${esc(covers)}. Aired / distinct items.</p>
    <table><thead><tr><th>Pool / show</th><th class="num">Aired</th><th></th><th class="num">First repeat</th></tr></thead>
    <tbody>${depthRows}</tbody></table></section>`);

  // 5. Overlap
  const overlapRows = d.overlap.this_channel_whole_library
    ? '<p class="muted">This channel\'s pools resolve to the whole library, so every other channel overlaps it; no list.</p>'
    : ov.length === 0 ? '<p class="muted">No other channel shares an item.</p>'
    : ov.map((c) => `<details class="overlap-row"><summary><strong>${esc(c.number)} ${esc(c.display_name || c.channel)}</strong>
        — ${c.shared} shared</summary><div class="titles">${c.titles.map((t) => `<div>${esc(t)}</div>`).join('')}</div></details>`).join('');
  const excluded = d.overlap.whole_library.length
    ? `<p class="muted">Left out: ${d.overlap.whole_library.map(esc).join(', ')} — their pools resolve to the whole library.</p>` : '';
  const errs = d.overlap.errors.map((e) => `<div class="notice">${esc(e.channel)}: ${esc(e.error)}</div>`).join('');
  html.push(`<section><h2>Overlap</h2>
    <p class="muted">Channels whose configs resolve to some of the same items (${d.overlap.candidates} candidates here), largest first.</p>
    ${overlapRows}${excluded}${errs}</section>`);

  // 6. Since last run
  const since = d.since_last == null
    ? '<p class="muted">First run of this channel in this session.</p>'
    : `<table><tbody>${d.since_last.map((r) => `<tr class="${r.changed ? 'changed' : ''}"><td>${esc(r.label)}</td>
        <td class="num"><span class="old">${esc(r.old ?? '—')}</span> → <span class="new">${esc(r.new ?? '—')}</span></td></tr>`).join('')}</tbody></table>`;
  html.push(`<section><h2>Since last run</h2>${since}</section>`);

  // 7. Tune-in samples, last: the rail reads numbers first, stills after.
  html.push(`${samplesSection}</aside></div>`);

  $('report').innerHTML = html.join('');
  renderGuide(d, colors);
  $('patternBtn').addEventListener('click', () => { location.hash = channelHash(d.channel, 'pattern', parseRoute().project); });
  const ppm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ppm'));
  $('gwrap').scrollTop = GUIDE_OPEN_HOUR * 60 * ppm;
}

// The channel's blocks in one line: what the masthead stub shows, in full on hover.
// A step's take: `[min, max]`, null for `take: all`.
const takeText = (t) => (t == null ? 'all' : t[0] === t[1] ? String(t[0]) : `${t[0]}-${t[1]}`);
const stepsWords = (steps) => steps.map((s) => (s.take == null ? `all of one ${s.pool} pick` : `${takeText(s.take)} from ${s.pool}`)).join(', then ');

function patternWords(blocks) {
  return blocks.map((b) => {
    const body = b.sequencer ? `sequencer ${b.sequencer}`
      : b.steps.length ? `${stepsWords(b.steps)}, repeating`
      : b.pools.length ? `pools ${b.pools.join(', ')}`
      : `${b.entries} fixed entries`;
    return `${b.name}: ${body}${b.placed.length ? ` — airs ${b.placed.join('; ')}` : ''}`;
  }).join('; ');
}

// The pattern, step by step, with what each pool actually aired in the span.
function patternPanel(d, colors) {
  const aired = {};
  for (const a of d.airings) {
    const t = (aired[a.pool] ||= { n: 0, secs: 0 });
    t.n++;
    t.secs += a.duration_secs;
  }
  const total = d.airings.reduce((s, a) => s + a.duration_secs, 0) || 1;
  const poolCells = (pool) => {
    const t = aired[pool] || { n: 0, secs: 0 };
    return `<td><span class="swatch" style="background:${colors[pool] || '#ccc'}"></span>${esc(pool)}</td>
      <td class="num">${t.n}</td><td class="num">${Math.round((t.secs / total) * 100)}%</td>`;
  };
  const stepsTable = (steps) => `<table class="steps"><thead><tr><th class="num">#</th><th class="num">Take</th><th>Pool</th><th class="num">Aired</th><th class="num">Airtime</th></tr></thead><tbody>
    ${steps.map((s, i) => `<tr><td class="num">${i + 1}</td><td class="num">${takeText(s.take)}${s.chance < 1 ? ` · ${Math.round(s.chance * 100)}%` : ''}</td>${poolCells(s.pool)}</tr>`).join('')}
    </tbody></table><p class="muted">Repeats from step 1 after step ${steps.length}. A pool on two steps counts its airings once.</p>`;
  const blocks = d.blocks.map((b) => {
    let rows;
    if (b.sequencer) rows = `<p class="muted">Sequencer ${esc(b.sequencer)} over pools ${esc(b.pools.join(', '))}.</p>`;
    else if (b.steps.length) rows = stepsTable(b.steps);
    else if (b.pools.length) rows = `<table class="steps"><tbody>${b.pools.map((p) => `<tr>${poolCells(p)}</tr>`).join('')}</tbody></table>`;
    else rows = `<p class="muted">${b.entries} fixed entries.</p>`;
    const placed = b.placed.length ? `<p class="muted">Airs ${esc(b.placed.join('; '))}.</p>` : '';
    return `<h4>${esc(b.name)}</h4>${placed}${rows}`;
  }).join('');
  return blocks;
}

// The Pattern sub-tab: the masthead's identity line, then every block's steps with what each pool aired.
function renderPattern(d) {
  document.title = `etv-station · ${d.number} ${d.display_name || d.name} · Pattern`;
  const colors = poolColor(d);
  $('report').innerHTML = `<header class="mast"><div class="bug">${esc(d.number)}</div>
      <div><h1>${esc(d.display_name || d.name)}</h1>
      <div class="sub">${esc(d.span.label)} (${esc(d.tz)}) · ${esc(d.config_path)}</div></div></header>
    <section class="insp pattern-page">${patternPanel(d, colors)}</section>`;
}

const num = (v) => (typeof v === 'number' && !Number.isInteger(v) ? v.toFixed(2) : String(v));

// One audit-trail stage: the producer's own sentence and verdict, the facts a reader asks first, then every field raw.
function stageHTML(d, s) {
  const det = (s.detail && typeof s.detail === 'object') ? s.detail : {};
  const label = (id) => d.titles[id] || (d.airings.find((x) => x.id === id) || {}).label || id;
  const facts = [];
  if (det.rank != null && det.candidate_count != null) facts.push(['rank', `#${det.rank} of ${det.candidate_count}`]);
  if (det.score != null) facts.push(['score', num(det.score)]);
  if (det.draw) facts.push(['draw', det.draw]);
  if (Array.isArray(det.favor_matches) && det.favor_matches.length) facts.push(['matched', det.favor_matches.join(' · ')]);
  if (Array.isArray(det.disfavor_matches) && det.disfavor_matches.length) facts.push(['penalised', det.disfavor_matches.join(' · ')]);
  if (Array.isArray(det.near_misses) && det.near_misses.length) {
    facts.push(['passed over', det.near_misses.map((m) => `${label(m.id)} (${num(m.score)})`).join(' · ')]);
    facts.push(['because', [...new Set(det.near_misses.map((m) => m.reason))].join(' · ')]);
  }
  for (const k of ['source', 'take', 'from', 'expr']) {
    if (det[k] != null) facts.push([k, typeof det[k] === 'object' ? JSON.stringify(det[k]) : det[k]]);
  }
  const raw = Object.entries(det).filter(([, v]) => v != null && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(typeof v === 'object' ? JSON.stringify(v) : num(v))}</dd>`).join('');
  return `<div class="stage"><div class="hd"><span class="chip">${esc(s.stage)}</span><span class="chip">${esc(s.by)}</span></div>
    ${s.guide ? `<div><b>${esc(s.guide)}</b></div>` : ''}<div class="muted">${esc(s.verdict)}</div>
    <dl class="kv">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${raw ? `<details><summary class="muted">all ${Object.keys(det).length} fields</summary><dl class="kv">${raw}</dl></details>` : ''}</div>`;
}

// Why one airing is on the schedule: its selection trail, every airing of the same item, and its catalog record.
function airingPanel(d, a, colors) {
  const tz = d.tz;
  const all = d.airings.filter((x) => x.id === a.id);
  const sample = d.samples.find((s) => s.index === a.index);
  const trail = Array.isArray(a.audit) ? a.audit : [];
  const hist = all.map((x) => `<li class="${x.index === a.index ? 'me' : ''}">${esc(dayOf(x.start, tz))} ${esc(timeOf(x.start, tz))}${x.repeat_of != null ? ' · repeat' : ' · first airing'}${x.index === a.index ? ' ← this one' : ''}</li>`).join('');
  const cat = [
    a.genres && a.genres.length ? `genres: ${a.genres.join(', ')}` : null,
    a.collections && a.collections.length ? `collections: ${a.collections.join(', ')}` : null,
    a.directors && a.directors.length ? `dir. ${a.directors.join(', ')}` : null,
  ].filter(Boolean).join(' · ');
  return `<button class="x" type="button" aria-label="Close">×</button>
    <h3>${esc(headline(a))}</h3><div class="ep">${esc(subline(a))}</div>
    <div class="meta"><span>${esc(dayOf(a.start, tz))} ${esc(timeOf(a.start, tz))}–${esc(timeOf(a.start + a.duration_secs, tz))}</span>
      <span>${Math.round(a.duration_secs / 60)} min</span>${a.projected ? '<span class="tag-proj">Projected — not scheduled</span>' : ''}<span><span class="swatch" style="background:${colors[a.pool] || '#ccc'}"></span>${esc(a.pool)}</span>
      ${a.content_rating ? `<span>rated ${esc(a.content_rating)}</span>` : ''}${sample ? `<span><span class="pin">${sample.n}</span>tune-in sample</span>` : ''}</div>
    <h4>Why it's here: ${trail.length} stage${trail.length === 1 ? '' : 's'}</h4>
    ${trail.length ? trail.map((s) => stageHTML(d, s)).join('') : '<div class="muted">No selection trail was recorded for this airing.</div>'}
    <h4>Airings in ${esc(d.span.label)} (${all.length})</h4><ol class="hist">${hist}</ol>
    <h4>Catalog</h4><div class="sum">${esc(a.id)}${cat ? ' · ' + esc(cat) : ''}${a.summary ? `<br>${esc(a.summary)}` : ''}</div>`;
}

// ---- Guide: ETV-next's live XMLTV grid, read by the browser. Clicking a programme asks the station for that airing's audit record.
const GUIDE_PPM = 3.1;        // px per minute
const GUIDE_BACK_MIN = 60;    // the grid opens this long before the half-hour at or before now
const GUIDE_SPAN_MIN = 8 * 60;
const GUIDE_CH_PX = 150;
let guideSeq = 0;
let guideBase = null;
let guideData = null;
let hlsPlayer = null;
let hlsScript = null;

// The ETV-next origin (and path prefix) the browser reads from: the station's ETV_NEXT_URL, else this page's own host on 8409.
async function etvBase() {
  if (guideBase) return guideBase;
  let url = null;
  try { url = (await (await fetch('/api/health')).json()).etv_next_url; } catch (e) { /* fall back to the page's host */ }
  guideBase = (url || `${location.protocol}//${location.hostname}:8409`).replace(/\/+$/, '');
  return guideBase;
}

function parseM3u(text) {
  const out = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].startsWith('#EXTINF')) continue;
    const attr = (k) => (lines[i].match(new RegExp(`${k}="([^"]*)"`)) || [])[1];
    out.push({ id: attr('tvg-id'), chno: attr('tvg-chno'), name: attr('tvg-name') || lines[i].split(',').pop().trim() });
  }
  return out;
}

// XMLTV's `20261019201500 +0000` as Unix seconds.
function xmltvTime(s) {
  const m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)\s*([+-])(\d\d)(\d\d)$/.exec((s || '').trim());
  if (!m) return NaN;
  const off = (m[7] === '-' ? -1 : 1) * (Number(m[8]) * 60 + Number(m[9]));
  return Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) / 1000 - off * 60;
}

function parseXmltv(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('the XMLTV did not parse');
  const names = {};
  for (const c of doc.querySelectorAll('tv > channel')) {
    const digits = [...c.querySelectorAll('display-name')].map((n) => n.textContent.trim()).find((t) => /^\d+$/.test(t));
    names[c.getAttribute('id')] = digits ? Number(digits) : null;
  }
  const programmes = {};
  for (const p of doc.querySelectorAll('tv > programme')) {
    const start = xmltvTime(p.getAttribute('start'));
    const stop = xmltvTime(p.getAttribute('stop'));
    if (!(stop > start)) continue;
    const text = (tag) => { const e = p.querySelector(tag); return e ? e.textContent.trim() : ''; };
    (programmes[p.getAttribute('channel')] ||= []).push({ start, stop, title: text('title'), sub: text('sub-title') });
  }
  return { numbers: names, programmes };
}

async function fetchText(url) {
  let res;
  try { res = await fetch(url); } catch (e) { throw new Error(`${url}: ${e.message || e}`); }
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.text();
}

async function loadGuide() {
  stopPlayer();
  const seq = ++guideSeq;
  const began = Date.now();
  const base = await etvBase();
  const urls = { m3u: `${base}/channels.m3u`, xml: `${base}/xmltv.xml` };
  $('report').innerHTML = `<div class="gtool"><strong>Guide</strong><span class="gsrc">from ${esc(base)}</span></div><div id="gstate"></div>`;
  const tick = () => { $('gstate').innerHTML = `<span class="spinner"></span>Loading the guide from ${esc(base)}… (${Math.round((Date.now() - began) / 1000)}s)`; };
  tick();
  const timer = setInterval(() => { if ($('gstate')) tick(); }, 1000);
  let data;
  try {
    const [m3u, xml] = await Promise.allSettled([fetchText(urls.m3u), fetchText(urls.xml)]);
    const failed = [m3u, xml].filter((r) => r.status === 'rejected').map((r) => r.reason.message || String(r.reason));
    if (failed.length) throw new Error(failed.join('\n'));
    data = { channels: parseM3u(m3u.value), xmltv: parseXmltv(xml.value) };
  } catch (e) {
    data = { error: String(e.message || e) };
  } finally {
    clearInterval(timer);
  }
  if (seq !== guideSeq) return;
  if (data.error) {
    $('gstate').innerHTML = `<div class="error">ETV-next is unreachable or answered badly.\nTried ${esc(urls.m3u)} and ${esc(urls.xml)}\n${esc(data.error)}</div>
      <p class="muted">The base URL is the station's ETV_NEXT_URL, else this page's host on port 8409.</p>`;
    return;
  }
  guideData = data;
  drawGuide(data, base);
}

// hls.js is served by the dashboard itself (/assets/hls.min.js), loaded only when a browser cannot play HLS natively.
function loadHls() {
  hlsScript ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/assets/hls.min.js';
    s.onload = () => resolve(window.Hls);
    s.onerror = () => { hlsScript = null; reject(new Error('the dashboard could not load /assets/hls.min.js')); };
    document.head.appendChild(s);
  });
  return hlsScript;
}

function stopPlayer() {
  if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
  document.querySelectorAll('.tg-ch.playing').forEach((r) => r.classList.remove('playing'));
  const p = $('player');
  if (p) { p.hidden = true; p.innerHTML = ''; }
}

// Plays ETV-next's /channel/{n}.m3u8 beside the grid, and says in words why it could not.
async function watchChannel(row) {
  const { number, name, id } = row.dataset;
  const p = $('player');
  if (!p) return;
  stopPlayer();
  row.classList.add('playing');
  const base = await etvBase();
  const url = `${base}/channel/${number}.m3u8`;
  const now = Math.floor(Date.now() / 1000);
  const cur = ((guideData && guideData.xmltv.programmes[id]) || []).find((g) => g.start <= now && now < g.stop);
  p.innerHTML = `<button class="x" type="button" aria-label="Close player">×</button><h3>${esc(number)} ${esc(name)}</h3>
    <div class="now">${cur ? `Now: ${esc(cur.title)}${cur.sub ? ` · ${esc(cur.sub)}` : ''} (${esc(timeOf(cur.start))}–${esc(timeOf(cur.stop))})` : 'Nothing is listed on the guide right now.'}</div>
    <video id="pv" controls autoplay muted playsinline></video><div id="perr"></div>`;
  p.hidden = false;
  p.querySelector('.x').addEventListener('click', stopPlayer);
  const video = $('pv');
  const fail = (what) => { const e = $('perr'); if (e && $('pv') === video) e.innerHTML = `<div class="error err">Cannot play ${esc(url)}\n${esc(what)}</div>`; };
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.addEventListener('error', () => fail(`The browser's player reported an error${video.error && video.error.message ? `: ${video.error.message}` : ''} (the manifest may be missing or unreachable).`));
    video.src = url;
    return;
  }
  let Hls;
  try { Hls = await loadHls(); } catch (e) { fail(String(e.message || e)); return; }
  if ($('pv') !== video) return;   // another channel was picked meanwhile
  if (!Hls.isSupported()) { fail('This browser cannot play HLS.'); return; }
  const hls = new Hls();
  hlsPlayer = hls;
  hls.on(Hls.Events.ERROR, (_, d) => {
    if (!d.fatal) return;
    const status = d.response && d.response.code ? `HTTP ${d.response.code} for ${d.url || url}` : (d.details || d.type);
    fail(`${d.type === Hls.ErrorTypes.NETWORK_ERROR ? 'Network error' : 'Playback error'}: ${status}`);
    hls.destroy();
    if (hlsPlayer === hls) hlsPlayer = null;
  });
  hls.loadSource(url);
  hls.attachMedia(video);
}
document.addEventListener('click', (e) => { const r = e.target.closest('.tg-ch.watch'); if (r) watchChannel(r); });
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.tg-ch.watch')) { e.preventDefault(); watchChannel(e.target.closest('.tg-ch.watch')); }
});

function drawGuide(data, base) {
  const now = Math.floor(Date.now() / 1000);
  const wstart = Math.floor(now / 1800) * 1800 - GUIDE_BACK_MIN * 60;
  const wend = wstart + GUIDE_SPAN_MIN * 60;
  const width = GUIDE_SPAN_MIN * GUIDE_PPM;
  const ticks = [];
  for (let t = wstart; t < wend; t += 1800) {
    ticks.push(`<span style="left:${((t - wstart) / 60) * GUIDE_PPM}px">${esc(timeOf(t))}</span>`);
  }
  const rows = data.channels.map((c) => {
    const number = c.chno && /^\d+$/.test(c.chno) ? Number(c.chno)
      : data.xmltv.numbers[c.id] != null ? data.xmltv.numbers[c.id]
      : Number((/(\d+)\D*$/.exec(c.id || '') || [])[1]);
    const blocks = (data.xmltv.programmes[c.id] || []).filter((p) => p.stop > wstart && p.start < wend).map((p) => {
      const s = Math.max(p.start, wstart);
      const e = Math.min(p.stop, wend);
      const left = ((s - wstart) / 60) * GUIDE_PPM;
      const w = Math.max(((e - s) / 60) * GUIDE_PPM - 2, 2);
      const label = `${timeOf(p.start)}–${timeOf(p.stop)} · ${p.title}${p.sub ? ` · ${p.sub}` : ''}`;
      return `<div class="pgm${p.start <= now && now < p.stop ? ' live' : ''}" tabindex="0" data-number="${number}" data-start="${p.start}" data-stop="${p.stop}"
        data-title="${esc(p.title)}" data-sub="${esc(p.sub)}" data-channel="${esc(c.name)}" data-tip="${esc(label)}" aria-label="${esc(label)}"
        style="left:${left}px;width:${w}px">${esc(p.title)}</div>`;
    }).join('');
    const watch = Number.isFinite(number) ? ` watch" tabindex="0" role="button" data-number="${number}" data-name="${esc(c.name)}" data-id="${esc(c.id)}` : '';
    return `<div class="tg-row"><div class="tg-ch${watch}" title="${Number.isFinite(number) ? 'Watch ' : ''}${esc(c.name)}"><span class="n">${esc(Number.isFinite(number) ? number : '—')}</span>${esc(c.name)}</div>
      <div class="tg-track" style="width:${width}px">${blocks}</div></div>`;
  }).join('');
  const nowX = GUIDE_CH_PX + ((now - wstart) / 60) * GUIDE_PPM;
  $('report').innerHTML = `<div class="gtool"><strong>Guide</strong><span class="muted">${data.channels.length} channels · updated ${esc(timeOf(now))}</span>
      <button type="button" id="guideReload">Reload</button><span class="gsrc">from ${esc(base)}</span></div>
    <div class="layout"><div class="gwrap" id="gg" style="--chw:${GUIDE_CH_PX}px;--gppm:${GUIDE_PPM}px">
      <div class="tg"><div class="tg-head"><div class="tg-corner"></div><div class="tg-times" style="width:${width}px">${ticks.join('')}</div></div>
        ${rows}<div class="tg-now" style="left:${nowX}px"></div></div></div>
      <aside class="rail"><section class="player" id="player" hidden></section><section class="insp" id="insp" hidden></section>
        <p class="muted gnote">Click a channel to watch it. Click a programme to see why it is on: the stored selection trail of that airing.</p></aside></div>`;
  $('guideReload').addEventListener('click', loadGuide);
  const g = $('gg');
  g.scrollLeft = Math.max(0, ((now - wstart) / 60) * GUIDE_PPM - 120);
}

async function selectProgramme(el) {
  const { number, start, stop, title, sub, channel } = el.dataset;
  const airing = `${number}.${start}`;
  const head = `<button class="x" type="button" aria-label="Close">×</button><h3>${esc(title)}</h3><div class="ep">${esc(sub)}</div>
    <div class="meta"><span>${esc(dayOf(Number(start)))} ${esc(timeOf(Number(start)))}–${esc(timeOf(Number(stop)))}</span><span>${Math.round((stop - start) / 60)} min</span><span>${esc(number)} ${esc(channel)}</span></div>`;
  showPanel(`${head}<div class="muted"><span class="spinner"></span>Reading the audit for airing ${esc(airing)}…</div>`);
  el.classList.add('sel');
  let data; let status = 0;
  try {
    const res = await fetch(`/api/airings/${encodeURIComponent(airing)}/audit`);
    status = res.status;
    data = await res.json();
  } catch (e) {
    data = { error: String(e) };
  }
  if (!el.classList.contains('sel')) return;   // another programme was picked meanwhile
  const panel = $('insp');
  if (!panel) return;
  const keep = (html) => { panel.innerHTML = html; panel.querySelector('.x').addEventListener('click', closePanel); };
  if (status !== 200) {
    keep(`${head}<div class="error err">HTTP ${status || '—'}: ${esc(data.error || 'no error message')}</div>`);
    return;
  }
  const trail = Array.isArray(data.stages) ? data.stages : [];
  const it = data.item;
  keep(`<button class="x" type="button" aria-label="Close">×</button><h3>${esc(it.label)}</h3><div class="ep">${esc(sub)}</div>
    <div class="meta"><span>${esc(dayOf(data.start))} ${esc(timeOf(data.start))}–${esc(timeOf(data.finish))}</span><span>${Math.round((data.finish - data.start) / 60)} min</span><span>${esc(data.number)} ${esc(channel)}</span>
      ${it.content_rating ? `<span>rated ${esc(it.content_rating)}</span>` : ''}</div>
    <h4>Why it's here: ${trail.length} stage${trail.length === 1 ? '' : 's'}</h4>
    ${trail.length ? trail.map((s) => stageHTML({ titles: data.titles || {}, airings: [] }, s)).join('') : '<div class="muted">No selection trail was recorded for this airing.</div>'}
    <h4>Catalog</h4><div class="sum">${esc(it.id)}${it.summary ? `<br>${esc(it.summary)}` : ''}</div>`);
}
document.addEventListener('click', (e) => { const p = e.target.closest('.pgm'); if (p) selectProgramme(p); });
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.pgm')) { e.preventDefault(); selectProgramme(e.target.closest('.pgm')); }
});

function closePanel() {
  const p = $('insp');
  if (p) { p.hidden = true; p.innerHTML = ''; }
  document.querySelectorAll('.blk.sel, .pgm.sel').forEach((b) => b.classList.remove('sel'));
}

function showPanel(html) {
  closePanel();
  const p = $('insp');
  p.innerHTML = html;
  p.hidden = false;
  p.querySelector('.x').addEventListener('click', closePanel);
  // Wide, this scrolls the rail to its top; narrow, where the rail sits below the guide, it scrolls the page to the panel.
  p.scrollIntoView({ block: 'start' });
}

function selectBlock(b) {
  if (!current || !b || b.dataset.index == null) return;
  const a = current.airings[Number(b.dataset.index)];
  showPanel(airingPanel(current, a, poolColor(current)));
  document.querySelectorAll(`.blk[data-index="${a.index}"]`).forEach((x) => x.classList.add('sel'));
}
document.addEventListener('click', (e) => { const b = e.target.closest('.blk'); if (b) selectBlock(b); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.blk')) { e.preventDefault(); selectBlock(e.target.closest('.blk')); }
});

function renderGuide(d, colors) {
  const tz = d.tz;
  const cells = ['<div class="corner"></div>'];
  for (let i = 0; i + 1 < d.day_starts.length; i++) cells.push(`<div class="colhead">${esc(dayOf(d.day_starts[i], tz))}</div>`);
  cells.push(`<div class="gutter">${Array.from({ length: 24 }, (_, h) =>
    `<span style="top:calc(${h * 60} * var(--ppm))${h === 0 ? ';transform:none' : ''}">${hourLabel(h)}</span>`).join('')}</div>`);
  // A block shows only the lines its height holds (a line is about 13px, plus 6px of padding and
  // border); a block too short for one line shows nothing and names itself in its tooltip.
  const ppm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ppm'));
  for (let i = 0; i + 1 < d.day_starts.length; i++) {
    const ds = d.day_starts[i];
    const de = d.day_starts[i + 1];
    // Minutes on the column's scale, so a 23- or 25-hour DST day still fills its column.
    const scale = 1440 / ((de - ds) / 60);
    const blocks = [];
    for (const a of d.airings) {
      const s = Math.max(a.start, ds);
      const e = Math.min(a.start + a.duration_secs, de);
      if (e <= s) continue;
      const top = ((s - ds) / 60) * scale;
      const h = ((e - s) / 60) * scale;
      const rep = a.repeat_of != null;
      // An airing crossing midnight is drawn in both columns; the second copy is marked as the
      // continuation and carries no R badge or tab stop of its own. A pin goes in the column holding its moment.
      const cont = a.start < ds;
      const sample = d.samples.find((x) => x.index === a.index && x.at >= ds && x.at < de);
      const label = `${timeOf(a.start, tz)}–${timeOf(a.start + a.duration_secs, tz)} · ${a.label} · ${a.pool}`
        + (a.projected ? ' · Projected — not scheduled' : '')
        + (rep ? ` · repeat, first aired ${dayOf(d.airings[a.repeat_of].start, tz)} ${timeOf(d.airings[a.repeat_of].start, tz)}` : '');
      const px = h * ppm;
      const time = `<span class="tm">${cont ? `cont. from ${esc(timeOf(a.start, tz))}` : esc(timeOf(a.start, tz))}</span> ${sample ? `<span class="pin">${sample.n}</span>` : ''}${rep && !cont ? '<span class="rbadge">R</span>' : ''}`;
      const title = `<b>${esc(headline(a))}</b>`;
      const body = px >= 45 ? `<div>${time}</div><div>${title}</div><div>${esc(subline(a))}</div>`
        : px >= 32 ? `<div>${time}</div><div>${title}</div>`
        : px >= 19 ? `<div>${time} ${title}</div>`
        : '';
      blocks.push(`<div class="blk${rep ? ' hatch' : ''}${a.projected ? ' proj' : ''}${body ? '' : ' tiny'}" data-index="${a.index}"${cont ? '' : ' tabindex="0"'} data-tip="${esc(label)}" aria-label="${esc(label)}"
        style="top:calc(${top} * var(--ppm));height:calc(${h} * var(--ppm));background-color:${colors[a.pool] || '#ccc'}">${body}</div>`);
    }
    // The frontier: where the published playout ends. Past it, blocks are projected.
    if (d.frontier != null && d.frontier >= ds && d.frontier < de) {
      blocks.push(`<div class="frontier" style="top:calc(${((d.frontier - ds) / 60) * scale} * var(--ppm))"><span>frontier ${esc(timeOf(d.frontier, tz))}</span></div>`);
    }
    cells.push(`<div class="col">${blocks.join('')}</div>`);
  }
  $('guide').innerHTML = cells.join('');
}

// Full title on hover or keyboard focus, for blocks too short to show it.
function showTip(el) {
  const tip = $('tip');
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left), window.innerWidth - tip.offsetWidth - 8);
  const top = r.top - tip.offsetHeight - 6 > 0 ? r.top - tip.offsetHeight - 6 : r.bottom + 6;
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}
const hideTip = () => { $('tip').hidden = true; };
document.addEventListener('mouseover', (e) => { const b = e.target.closest('.blk'); if (b) showTip(b); });
document.addEventListener('mouseout', (e) => {
  if (!e.target.closest('.blk')) return;
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('.blk');
  if (focused) showTip(focused); else hideTip();
});
document.addEventListener('focusin', (e) => { const b = e.target.closest('.blk'); if (b) showTip(b); else hideTip(); });
document.addEventListener('focusout', (e) => { if (e.target.closest('.blk')) hideTip(); });
// Focusing a block scrolls it into view; keep its tip attached instead of dropping it.
document.addEventListener('scroll', () => {
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('.blk');
  if (focused) showTip(focused); else hideTip();
}, true);

$('lineupSelect').addEventListener('change', () => { const r = parseRoute(); location.hash = channelHash($('lineupSelect').value, r.view, r.project); });
// Choosing a projection length changes the hash; choosing the pressed length again asks for it afresh.
function chooseProject(project) {
  const r = parseRoute();
  if (!r.channel) return;
  const target = channelHash(r.channel, r.view, project);
  if (location.hash === target) { shown = null; route(); } else location.hash = target;
}
for (const b of $('projBtns').querySelectorAll('button')) b.addEventListener('click', () => chooseProject(b.dataset.project));
$('projClear').addEventListener('click', () => chooseProject(null));
window.addEventListener('hashchange', route);

route();
</script>
</body>
