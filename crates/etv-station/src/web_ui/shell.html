<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>etv-station</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --fg: #16181d; --muted: #5f6670; --line: #dfe2e7; --panel: #f6f7f9;
    --accent: #3d4fd1; --bar: #3d4fd1; --bar-open: #9aa3b1; --track: #e9ebef;
    --warn-bg: #fff6d8; --warn-fg: #6b4e00; --err-bg: #fde8e8; --err-fg: #8a1414;
    --ink-bg: #16181d; --ink-fg: #ffffff;
    --up: #1a7f37; --down: #b42318;
    --ppm: 1.15px;   /* guide height per minute of airtime */
    --col: 138px;    /* guide width per day */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121418; --fg: #e6e8ec; --muted: #9298a3; --line: #2c3038; --panel: #1b1e24;
      --accent: #8e9cff; --bar: #8e9cff; --bar-open: #5c6370; --track: #262a32;
      --warn-bg: #3a3014; --warn-fg: #f2d98a; --err-bg: #3d1c1c; --err-fg: #ffb4b4;
      --ink-bg: #e6e8ec; --ink-fg: #121418;
      --up: #5fd07a; --down: #ff8f85;
    }
  }
  * { box-sizing: border-box; }
  /* `hidden` must win over every `display` rule below (the toolbar is flex, the narrow picker block). */
  [hidden] { display: none !important; }
  /* The page itself never scrolls: tabs, lineup and masthead stay put, and only the lineup, the guide and the rail scroll inside it. */
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0;
    background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.4;
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

  /* The dashboard frame: a tab bar, then on Channels the lineup beside the channel's page. */
  .tabs { display: flex; align-items: center; gap: 4px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  .tabs .brand { font-weight: 800; margin-right: 12px; white-space: nowrap; }
  .tabs a { padding: 4px 12px; border-radius: 3px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 13px; }
  .tabs a[aria-current="page"] { background: var(--bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1fr); }
  .app.wide { grid-template-columns: minmax(0, 1fr); }
  .lineup { border-right: 1px solid var(--line); overflow: auto; padding: 8px 0; font-size: 13px; }
  .lineup a { display: flex; gap: 8px; padding: 3px 14px; color: var(--fg); text-decoration: none; white-space: nowrap; }
  .lineup a .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
  .lineup a .nm { overflow: hidden; text-overflow: ellipsis; }
  .lineup a:hover { background: var(--panel); }
  .lineup a[aria-current="page"] { background: var(--accent); color: var(--bg); }
  .lineup a[aria-current="page"] .n { color: inherit; }
  .lineup a.broken .nm { color: var(--err-fg); }
  .lineup a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lineup .lstate { padding: 4px 14px; }
  #lineupSelect { display: none; }
  main { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 10px 20px 12px; }
  .subtabs { display: flex; gap: 2px; }
  .subtabs a { padding: 3px 10px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 600; }
  .subtabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
  .pattern-page { max-width: 760px; }
  .empty { max-width: 520px; margin: 40px auto; text-align: center; }
  .empty h1 { font-size: 20px; margin: 0 0 6px; }
  a { color: var(--accent); }
  h2 { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; margin-bottom: 10px; }
  .toolbar .spacer { flex: 1; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; }
  button:disabled { opacity: .45; cursor: default; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  #projState { min-width: 0; }
  #state { min-height: 18px; }
  .spinner { display: inline-block; width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px;
    border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #report { transition: opacity .15s ease; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
  #report.loading { opacity: .35; pointer-events: none; }
  .notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: 3px; padding: 4px 10px; margin-top: 6px; font-size: 12.5px; }
  .error { background: var(--err-bg); color: var(--err-fg); border-radius: 3px; padding: 10px 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12.5px; }

  /* Masthead: channel number, name, span and pattern, and the four numbers in one row. */
  .mast { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center;
    padding-bottom: 10px; border-bottom: 2px solid var(--fg); margin-bottom: 10px; }
  .mast .bug { font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; border: 2px solid var(--fg); border-radius: 3px; padding: 2px 8px; }
  .mast h1 { font-size: 22px; margin: 0; }
  .mast .sub { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .mast .pattern { font-size: 13px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .mast .pstub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--muted); }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: 13px; flex: none; }
  .mast .notes { grid-column: 1 / -1; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0; }
  .facts dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .facts dd { margin: 0; font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .facts dd.d { font-size: 11.5px; font-weight: 400; color: var(--muted); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 900px) { .mast { grid-template-columns: auto minmax(0, 1fr); } .facts { grid-column: 1 / -1; } }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; margin: 0 0 8px; align-items: center; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 1px; margin-right: 5px; vertical-align: -1px; }
  .pin { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%;
    background: var(--ink-bg); color: var(--ink-fg); font-size: 10.5px; font-weight: 700; margin-right: 5px; flex: none; }
  .rbadge { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; border-radius: 2px;
    background: var(--ink-bg); color: var(--ink-fg); font-size: 10px; font-weight: 800; margin-right: 5px; padding: 0 2px; }
  .hatch { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.13) 0 4px, transparent 4px 8px); }
  /* Projected, not scheduled: a dashed edge and a crosshatch no repeat marker uses. */
  .blk.proj { border: 1px dashed var(--fg); opacity: .8;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0 3px, transparent 3px 7px), repeating-linear-gradient(135deg, rgba(255,255,255,.5) 0 3px, transparent 3px 7px); }
  /* Changed by the draft: a thick solid frame with an inset gap, which no repeat or projected marker uses and which does not rely on colour. */
  .blk.chg { border: 3px solid var(--fg); box-shadow: inset 0 0 0 2px var(--bg); }
  .swatch.chg { width: 14px; height: 10px; background-color: var(--track); border: 3px solid var(--fg); box-sizing: border-box; }
  .dir { font-weight: 700; white-space: nowrap; }
  .arrow { color: var(--muted); }
  .swatch.proj { width: 14px; height: 10px; background-color: var(--track); border: 1px dashed var(--fg); }
  .frontier { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--err-fg); z-index: 1; pointer-events: none; }
  .frontier span { position: absolute; right: 2px; top: 1px; font-size: 9.5px; font-weight: 700; color: var(--err-fg); background: var(--bg); padding: 0 3px; border-radius: 2px; }
  .swatch.fl { height: 0; width: 14px; border-top: 2px solid var(--err-fg); background: none; vertical-align: 3px; }
  .tag-proj { font-size: 11px; font-weight: 700; border: 1px dashed var(--fg); border-radius: 2px; padding: 0 5px; }

  /* Guide first: a column per day, time running down, block height = running time. Side rail holds the numbers. */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; }
  .gwrap { overflow: auto; min-height: 0; border: 1px solid var(--line); }
  /* max-content, so the sticky hour gutter's containing block spans every day column, not just the viewport. */
  .wk { display: grid; grid-template-columns: 44px repeat(var(--n), var(--col)); width: max-content; }
  .colhead { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 2px solid var(--fg); border-left: 1px solid var(--line);
    font-weight: 700; font-size: 12px; padding: 4px 6px; white-space: nowrap; }
  .corner { position: sticky; top: 0; left: 0; z-index: 4; background: var(--bg); border-bottom: 2px solid var(--fg); }
  .gutter { position: sticky; left: 0; z-index: 2; background: var(--bg); height: calc(1440 * var(--ppm)); }
  .gutter span { position: absolute; right: 4px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; transform: translateY(-50%); }
  .col { position: relative; height: calc(1440 * var(--ppm)); border-left: 1px solid var(--line);
    background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(60 * var(--ppm))); }
  .blk { position: absolute; left: 2px; right: 2px; border-radius: 2px; overflow: hidden; color: #111; font-size: 11px; line-height: 1.2;
    padding: 2px 4px; border: 1px solid rgba(0,0,0,.2); outline: none; }
  /* An inset outline, never box-shadow or z-index: changing a block's stacking repaints the whole grid on every hover. */
  .blk:focus-visible, .blk:hover { outline: 2px solid var(--fg); outline-offset: -2px; }
  .blk.tiny { padding: 0; border-width: 0 0 1px; }
  .blk .tm { font-variant-numeric: tabular-nums; opacity: .7; font-size: 10px; }
  .blk > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk b { font-weight: 700; }
  .blk .pin, .blk .rbadge { width: 14px; height: 14px; min-width: 14px; font-size: 9px; margin-right: 3px; vertical-align: 1px; }
  .blk .rbadge { background: #16181d; color: #fff; }

  .rail { min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .rail section { border-top: 1px solid var(--fg); padding: 6px 0 14px; min-width: 0; }
  .samples { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sample { min-width: 0; font-size: 11.5px; }
  .sample .still, .sample .still-missing { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); margin-bottom: 4px; }
  .sample .still { object-fit: contain; }
  .sample .still-missing { display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px;
    color: var(--muted); background: var(--track); font-size: 11.5px; }
  .sample .when { color: var(--muted); display: flex; align-items: center; }
  .sample .what { font-weight: 600; margin: 2px 0 3px; }
  .sample .prog { height: 4px; background: var(--track); overflow: hidden; }
  .sample .prog span { display: block; height: 100%; background: var(--accent); }
  .sample ol { margin: 3px 0 0; padding: 0; list-style: none; color: var(--muted); }

  /* The selected-item panel at the top of the rail: an airing's selection trail, or the channel's pattern. */
  .blk { cursor: pointer; }
  .blk.sel { outline: 3px solid var(--fg); outline-offset: -3px; }
  .rail section.insp { border-top: 2px solid var(--fg); background: var(--panel); padding: 8px 10px 12px; margin-bottom: 4px; }
  .insp h3 { font-size: 15px; margin: 0; }
  .insp .ep { color: var(--muted); font-size: 12.5px; }
  .insp .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .insp h4 { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
  .insp .stage { border-left: 2px solid var(--fg); padding: 2px 0 4px 8px; margin-bottom: 6px; font-size: 12px; }
  .insp .stage .hd { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .insp .chip { font-family: ui-monospace, monospace; font-size: 10.5px; padding: 0 4px; border: 1px solid var(--line); border-radius: 2px; }
  .insp dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 8px; margin: 3px 0 0; font-size: 11.5px; }
  .insp dl.kv dt { color: var(--muted); }
  .insp dl.kv dd { margin: 0; font-family: ui-monospace, monospace; font-size: 11px; overflow-wrap: anywhere; }
  .insp ol.hist { margin: 0; padding: 0; list-style: none; font-size: 12px; font-variant-numeric: tabular-nums; }
  .insp ol.hist li.me { font-weight: 700; }
  .insp .sum { font-size: 12px; color: var(--muted); }
  .insp .x { float: right; border: 0; background: none; font-size: 16px; line-height: 1; padding: 0 2px; }
  .insp table.steps td { font-size: 12px; }

  .ptotal { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .ptotal .big { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.principles td { vertical-align: top; padding: 3px 4px; }
  table.principles .pname { font-weight: 600; width: 34%; }
  table.principles .dots { white-space: nowrap; letter-spacing: 1px; font-size: 11px; }
  table.principles .pmeasure { font-size: 11.5px; }
  table.principles tr.unscored .pname { color: var(--muted); font-weight: 500; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 2px 5px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.show td.name { padding-left: 20px; }
  tr.pool td.name { font-weight: 600; }
  .bar { position: relative; height: 8px; background: var(--track); min-width: 40px; }
  .bar span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); }
  .bar span.open { background: var(--bar-open); }
  .overlap-row { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .overlap-row summary { cursor: pointer; }
  .overlap-row .titles { margin: 4px 0 2px 16px; font-size: 12px; color: var(--muted); }
  .old { color: var(--muted); }
  td.v-fail { background: var(--err-bg); color: var(--err-fg); }
  td.v-stale { background: var(--warn-bg); color: var(--warn-fg); }
  .changed .new { font-weight: 650; }

  @media (max-width: 900px) {
    :root { --col: 120px; }
    /* Too narrow to lock: the page scrolls, the guide keeps its own scroll box above the rail. */
    body { height: auto; overflow: visible; display: block; }
    /* The lineup folds into a picker above the channel's page. */
    .app { display: block; }
    .lineup { display: none; }
    #lineupSelect { display: block; margin: 10px 20px 0; max-width: calc(100% - 40px); }
    main { padding: 10px 16px; }
    #report { display: block; overflow: visible; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .gwrap { height: 70vh; }
    .rail { overflow: visible; }
  }
  /* Pools: one section per pool; the draft bar sits above them. */
  .draftbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 10px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 3px; position: sticky; top: 0; z-index: 5; }
  .draftbar.idle { border-left-color: var(--line); }
  .draftbar .spacer { flex: 1; }
  select, input[type=text] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
  .poolsec { border: 1px solid var(--line); border-radius: 3px; margin-bottom: 10px; }
  .poolsec > summary { cursor: pointer; padding: 6px 10px; background: var(--panel); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .poolsec .chip { font-family: ui-monospace, monospace; font-size: 10.5px; padding: 0 4px; border: 1px solid var(--line); border-radius: 2px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 20px; padding: 8px 10px 10px; }
  .pfield { min-width: 0; }
  .pfield.wide { grid-column: 1 / -1; }
  .pfield h4 { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .pfield h4 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; margin: 0; font-size: 12px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; font-family: ui-monospace, monospace; font-size: 11.5px; overflow-wrap: anywhere; }
  table.ptable input.w { width: 70px; }
  .addrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .addrow input.aw { width: 60px; }
  .searchbox { position: relative; }
  .sugg { position: absolute; z-index: 6; left: 0; top: 100%; min-width: 220px; max-height: 220px; overflow: auto; background: var(--bg); border: 1px solid var(--line); }
  .sugg div { padding: 3px 8px; cursor: pointer; }
  .sugg div:hover { background: var(--panel); }
  .rank-scroll { max-height: 360px; overflow: auto; border: 1px solid var(--line); }
  .rank-scroll thead th { position: sticky; top: 0; background: var(--bg); }
  .mv { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
  .mv.up { color: var(--up); } .mv.down { color: var(--down); } .mv.new, .mv.same { color: var(--muted); }
  #yamlOut pre { margin: 4px 0 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; overflow: auto; font-size: 12px; }

  /* Guide: a row per channel, time running across, programme width = running time. */
  .gsrc { color: var(--muted); font-size: 12px; margin-left: auto; }
  .gtool { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .tg { position: relative; width: max-content; }
  .tg-head, .tg-row { display: flex; }
  .tg-head { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 2px solid var(--fg); height: 22px; }
  .tg-corner, .tg-ch { position: sticky; left: 0; z-index: 2; width: var(--chw); flex: none; background: var(--bg); }
  .tg-ch { padding: 0 8px; line-height: 26px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--line); }
  .tg-ch .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .tg-times { position: relative; flex: none; }
  .tg-times span { position: absolute; top: 4px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 4px; border-left: 1px solid var(--line); height: 18px; }
  .tg-track { position: relative; flex: none; height: 26px; border-bottom: 1px solid var(--line);
    background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(30 * var(--gppm))); }
  .pgm { position: absolute; top: 2px; height: 22px; border-radius: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); font-size: 11.5px; line-height: 20px; padding: 0 5px; cursor: pointer; outline: none; }
  .pgm.live { border-color: var(--accent); }
  .pgm:hover, .pgm:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  .pgm.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
  .tg-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 1; pointer-events: none; }
  .gnote { margin-top: 8px; }
  .tg-ch.watch { cursor: pointer; }
  .tg-ch.watch:hover, .tg-ch.watch:focus-visible, .tg-ch.playing { outline: 2px solid var(--accent); outline-offset: -2px; }
  .player { border: 1px solid var(--line); margin-bottom: 12px; padding: 8px; }
  .player video { width: 100%; background: #000; display: block; aspect-ratio: 16 / 9; }
  .player h3 { margin: 0 0 2px; font-size: 14px; }
  .player .now { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .player .x { float: right; }
  .insp .err { margin-top: 8px; }
  /* Graphics: a list of scripts beside the result of the last render. */
  .gscripts { min-height: 0; overflow: auto; }
  .gscripts section { margin-bottom: 14px; }
  .grow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .grow .gname { flex: 1 1 240px; min-width: 0; }
  .grow .gpath { overflow-wrap: anywhere; }
  .grow input { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 5px; width: 5em; }
  .grow input.ggap { width: 6em; }
  .gmedia { display: block; width: 100%; background: #000; aspect-ratio: 16 / 9; object-fit: contain; border: 1px solid var(--line); }

  /* Edit: the draft bar and the note row under it are always laid out, so no control or text moves between states. */
  .tabs .soon { margin-left: auto; padding: 4px 12px; color: var(--muted); font-weight: 600; font-size: 13px; opacity: .55; cursor: not-allowed; }
  .ebar { flex: none; display: grid; grid-template-columns: 9em 11em minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center;
    height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); font-size: 13px; }
  .ebar .ech { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ebar .est { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ebar .eval { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ebar .eval.bad { color: var(--err-fg); }
  .ebar .eval.ok { color: var(--up); }
  .ebar button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .enote { flex: none; height: 3.4em; margin: 6px 0; overflow: auto; border-radius: 3px; padding: 4px 10px; font-size: 12.5px;
    background: var(--panel); color: var(--muted); }
  .enote.ok { background: #16301d; color: var(--up); }
  .enote.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .enote.bad { background: var(--err-bg); color: var(--err-fg); }
  .enote b { font-weight: 800; }
  .epage { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .ebody { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr); gap: 12px; }
  .ed { position: relative; min-height: 0; display: grid; grid-template-columns: 4.2em minmax(0, 1fr); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--bg); }
  .ed .gut { overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); padding: 6px 0; font: 12px/18px ui-monospace, monospace; color: var(--muted); text-align: right; }
  .ed .gut div { height: 18px; padding-right: 8px; position: relative; font-variant-numeric: tabular-nums; }
  .ed .gut .chg { background: rgba(142,156,255,.28); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
  .ed .gut .del::before { content: ''; position: absolute; left: 0; right: 0; top: 0; border-top: 2px solid var(--err-fg); }
  .ed .gut .err { background: var(--err-bg); color: var(--err-fg); box-shadow: inset 3px 0 0 var(--err-fg); font-weight: 800; }
  .ed textarea { border: 0; outline: 0; resize: none; background: transparent; color: var(--fg); padding: 6px 10px; font: 12px/18px ui-monospace, monospace;
    white-space: pre; overflow: auto; tab-size: 2; min-width: 0; }
  .ed textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .ed .eload { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .pv { min-height: 0; display: grid; grid-template-rows: 32px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 3px; font-size: 12.5px; overflow: hidden; }
  .pvtabs { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, .7fr) minmax(0, 1.3fr) minmax(0, 1fr); border-bottom: 1px solid var(--line); background: var(--panel); }
  .pvtabs button { border: 0; border-radius: 0; background: none; padding: 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pvtabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .pvtabs button.bad { color: var(--err-fg); }
  .pvbody, .eprof { min-height: 0; overflow: auto; padding: 8px 10px; }
  .pvrow { border-top: 1px solid var(--line); padding: 5px 0; }
  .pvrow:first-child { border-top: 0; }
  .pvrow .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pvrow .was { color: var(--muted); }
  .pvrow .mv { font-variant-numeric: tabular-nums; font-weight: 700; }
  .pvbig { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
  .eprof .pool { border-top: 1px solid var(--line); padding: 6px 0; }
  .eprof .pool:first-of-type { border-top: 0; }
  .eprof .pe { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  .eprof .pe .k { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eprof input, .eprof select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; font-size: 12.5px; }
  .eprof input.w { width: 4.5em; font-variant-numeric: tabular-nums; }
  .eprof .padd { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .eprof .padd input.v { flex: 1; min-width: 5em; }
  .ebar button { white-space: nowrap; }
  .ebar button.primary { min-width: 9.5em; }
  /* Narrow: the page scrolls, the bar takes two fixed rows (status above, buttons below), and the preview stacks under the editor. */
  @media (max-width: 900px) {
    .epage { overflow: visible; }
    .ebar { grid-template-columns: 7em 9em minmax(0, 1fr); grid-template-rows: 32px 32px; height: auto; padding: 4px 10px; row-gap: 4px; }
    .ebar #eapply { justify-self: end; }
    .enote { height: 6.2em; }
    .ebody { grid-template-columns: minmax(0, 1fr); grid-template-rows: 70vh 60vh; }
  }
  #tip { position: fixed; z-index: 10; max-width: 360px; background: var(--fg); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 3px; pointer-events: none; }
</style>
</head>
<body>
<nav class="tabs" aria-label="Dashboard">
  <span class="brand">etv-station</span>
  <a id="tabChannels" href="#/channels">Channels</a>
  <a id="tabEdit" href="#/edit">Edit</a>
  <a id="tabGuide" href="#/guide">Guide</a>
  <a id="tabHealth" href="#/health">Health</a>
  <span id="tabWatch" class="soon" aria-disabled="true" title="Watch: the viewer is planned">Watch</span>
</nav>
<div class="app" id="app">
  <nav class="lineup" id="lineup" aria-label="Channels"><div class="lstate muted">Loading the lineup…</div></nav>
  <main>
    <select id="lineupSelect" aria-label="Channel"></select>
    <div class="toolbar" id="toolbar">
      <nav class="subtabs" aria-label="Channel views">
        <a id="subSchedule" href="#">Schedule</a>
        <a id="subPattern" href="#">Pattern</a>
        <a id="subGraphics" href="#">Graphics</a>
        <a id="subPools" href="#">Pools</a>
      </nav>
      <span id="position" class="muted"></span>
      <span class="spacer"></span>
      <span id="projCtl" class="toolbar" style="margin:0">
        <span id="projState" class="muted" aria-live="polite"></span>
        <span class="muted" id="projLabel">Project ahead</span>
        <span class="seg" role="group" aria-labelledby="projLabel" id="projBtns">
          <button type="button" data-project="1d" aria-pressed="false">+1d</button>
          <button type="button" data-project="3d" aria-pressed="false">+3d</button>
          <button type="button" data-project="7d" aria-pressed="false">+7d</button>
          <button type="button" data-project="14d" aria-pressed="false">+14d</button>
        </span>
        <button id="projClear" type="button">Real only</button>
      </span>
    </div>
    <div id="state" class="muted"></div>
    <div id="report"></div>
  </main>
</div>
<div id="tip" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// One hue per pool, in first-airing order; light enough that dark text reads on it in both themes.
const POOL_COLORS = ['#a9c4ff', '#ffc98f', '#a8e0b4', '#f4a9c8', '#d3b8ff', '#ffe08a', '#9fe3e0', '#e0c3a3'];
// The guide opens scrolled to this hour, so the afternoon and evening fill the first screen.
const GUIDE_OPEN_HOUR = 12;

// A 202 poll gives up after this long and shows an error instead of spinning.
const POLL_DEADLINE_MS = 600000;
let current = null;   // the last channel review payload
let lineup = null;    // GET /api/lineup's channels, once loaded
let loadSeq = 0;  // a newer load() supersedes an older one still polling

// The view lives in the hash, using the API's own nouns: `#/channels/{key}/{schedule|pattern|graphics}?project=Nd`,
// `#/channels/{key}/pools?draft=ID`, `#/edit/{key}`, `#/guide`, `#/health`. A key holding a `/` (an examples/ channel) is percent-encoded.
function parseRoute() {
  const [path, qs] = location.hash.replace(/^#/, '').split('?');
  const parts = path.split('/').filter(Boolean);
  const q = new URLSearchParams(qs || '');
  const tab = ['channels', 'edit', 'guide', 'health'].includes(parts[0]) ? parts[0] : 'channels';
  return {
    tab,
    channel: (tab === 'channels' || tab === 'edit') && parts[1] ? decodeURIComponent(parts[1]) : null,
    view: ['pattern', 'pools', 'graphics'].includes(parts[2]) ? parts[2] : 'schedule',
    project: ['1d', '3d', '7d', '14d'].includes(q.get('project')) ? q.get('project') : null,
    draft: q.get('draft'),
  };
}
// With a draft open the Schedule projects 3 days unless the address names a length: a draft re-simulation is slow.
function routeWithDraftWindow(r) {
  if (r.draft && r.view === 'schedule' && !r.project) r.project = '3d';
  return r;
}
function editHash(channel) { return channel ? `#/edit/${encodeURIComponent(channel)}` : '#/edit'; }
function channelHash(channel, view, project, draft) {
  const q = [];
  if (project && view !== 'pools') q.push(`project=${project}`);
  if (draft && view !== 'pattern') q.push(`draft=${encodeURIComponent(draft)}`);
  return `#/channels/${encodeURIComponent(channel)}/${view || 'schedule'}${q.length ? `?${q.join('&')}` : ''}`;
}

function fmt(ts, tz, opts) {
  return new Date(ts * 1000).toLocaleString('en-US', { timeZone: tz, ...opts });
}
const timeOf = (ts, tz) => fmt(ts, tz, { hour: 'numeric', minute: '2-digit' });
const dayOf = (ts, tz) => fmt(ts, tz, { weekday: 'short', month: 'short', day: 'numeric' });
// A fixed seed is its number, a rotating seed is `{rotate}`, no seed is null.
const seedLabel = (seed) => (seed == null ? 'none' : typeof seed === 'object' ? `rotates every ${seed.rotate}` : String(seed));
const days1 = (d) => (Math.round(d * 10) / 10).toFixed(1);
const hourLabel = (h) => (h === 0 ? '12a' : h < 12 ? h + 'a' : h === 12 ? '12p' : (h - 12) + 'p');

// Fetches the channel's review. The real schedule answers at once and is drawn; while a requested
// projection runs the server answers 202 with that same real review, and while the lineup's overlap is
// still resolving the review's `overlap` is `{pending}`, so the page asks again every second beside a
// spinner and redraws when both have landed.
async function load(channel, project, view) {
  const q = new URLSearchParams();
  if (project) q.set('project', project);
  const began = Date.now();
  const projecting = () => {
    $('projState').innerHTML = `<span class="spinner"></span>Projecting ${esc(project.replace('d', ''))} day${project === '1d' ? '' : 's'}… (${Math.round((Date.now() - began) / 1000)}s)`;
  };
  $('state').textContent = '';
  $('projState').textContent = '';
  // Another channel's report never stays on screen under this one's load; the same channel's dims while it reloads.
  if (!current || current.channel !== channel) { current = null; $('report').innerHTML = ''; }
  $('report').classList.add('loading');
  setControls(project, true);
  const seq = ++loadSeq;
  const deadline = Date.now() + POLL_DEADLINE_MS;
  let data;
  let drewReal = false;
  try {
    for (;;) {
      const res = await fetch(`/api/channels/${encodeURIComponent(channel)}/review?${q}`);
      data = await res.json();
      if (seq !== loadSeq) return;
      if (!res.ok) data = { error: `HTTP ${res.status}: ${data.error || 'no error message'}` };
      if (!data.pending && !data.overlap?.pending) break;
      if (!drewReal) { $('report').classList.remove('loading'); show(data, view); drewReal = true; }
      if (Date.now() > deadline) throw new Error(`still ${data.pending ? 'projecting' : 'resolving the overlap'} after ${POLL_DEADLINE_MS / 1000}s; reload to keep waiting`);
      if (data.pending) projecting();
      await new Promise((r) => setTimeout(r, 1000));
      if (seq !== loadSeq) return;
    }
  } catch (e) {
    data = { error: String(e) };
  }
  if (seq !== loadSeq) return;
  $('report').classList.remove('loading');
  $('projState').textContent = '';
  setControls(project, false);
  $('state').textContent = '';
  if (data.error) {
    current = null;
    $('report').innerHTML = `<header class="mast"><h1>${esc(channel)}</h1></header>
      <h2>The review could not be built</h2><div class="error">${esc(data.error)}</div>`;
    return;
  }
  show(data, view);
}

// The Schedule with a draft open: the server re-simulates the channel with the draft's pools swapped in and answers
// {deployed, draft, diff}, or 202 while either simulation runs. The deployed review is drawn meanwhile; the page asks
// again every DRAFT_POLL_MS beside a counter, then draws the draft's review with the diff against the deployed one.
const DRAFT_POLL_MS = 15000;
async function loadDraft(channel, project, draft, view) {
  const began = Date.now();
  $('state').textContent = '';
  if (!current || current.channel !== channel) { current = null; $('report').innerHTML = ''; }
  $('report').classList.add('loading');
  setControls(project, true);
  const seq = ++loadSeq;
  const simulating = () => {
    const which = [];
    if (pendingNow.deployed) which.push('deployed');
    if (pendingNow.draft) which.push('draft');
    $('projState').innerHTML = which.length
      ? `<span class="spinner"></span>Simulating ${esc(which.join(' and '))}… (asked again every ${DRAFT_POLL_MS / 1000}s) ${Math.round((Date.now() - began) / 1000)}s`
      : `<span class="spinner"></span>Resolving the lineup's overlap… ${Math.round((Date.now() - began) / 1000)}s`;
  };
  const pendingNow = { deployed: true, draft: true };
  const ticker = setInterval(simulating, 1000);
  const q = new URLSearchParams({ draft });
  if (project) q.set('project', project);
  let data;
  let drewReal = false;
  try {
    simulating();
    for (;;) {
      const res = await fetch(`/api/channels/${encodeURIComponent(channel)}/review?${q}`);
      data = await res.json();
      if (seq !== loadSeq) return;
      if (!res.ok && res.status !== 202) data = { error: `HTTP ${res.status}: ${data.error || 'no error message'}` };
      if (!data.pending && !data.deployed?.overlap?.pending && !data.draft?.overlap?.pending) break;
      pendingNow.deployed = !!data.deployed_pending;
      pendingNow.draft = !!data.draft_pending;
      if (!drewReal && data.deployed && !data.deployed.error) { $('report').classList.remove('loading'); show(data.deployed, view); drewReal = true; }
      simulating();
      // Only the overlap left: it resolves in seconds, so ask again sooner than a simulation.
      await new Promise((r) => setTimeout(r, data.pending ? DRAFT_POLL_MS : 1000));
      if (seq !== loadSeq) return;
    }
  } catch (e) {
    data = { error: String(e) };
  } finally {
    clearInterval(ticker);
  }
  if (seq !== loadSeq) return;
  $('report').classList.remove('loading');
  $('projState').textContent = '';
  setControls(project, false);
  if (data.error) {
    current = null;
    $('report').innerHTML = `<header class="mast"><h1>${esc(channel)}</h1></header>
      <h2>The draft review could not be built</h2><div class="error">${esc(data.error)}</div>
      <p><a href="${channelHash(channel, 'schedule', project)}">Show the deployed schedule</a></p>`;
    return;
  }
  if (data.deployed && data.deployed.load_error) { show(data.deployed, view); return; }
  data.draft.diff = data.diff;
  data.draft.draftId = draft;
  show(data.draft, view);
}

// Draws one review payload, or the load-error page for a channel whose config fails to load.
function show(data, view) {
  if (data.load_error) {
    current = null;
    document.title = `etv-station · ${data.channel}`;
    $('report').innerHTML = `<header class="mast"><div><h1>${esc(data.channel)}</h1>
      <div class="sub">${esc(data.config_path)}</div></div></header>
      <h2>This channel's config fails to load</h2><div class="error">${esc(data.load_error)}</div>`;
    return;
  }
  // Per-item catalog fields arrive once per entry id in `items`; merge them onto each airing.
  for (const a of data.airings) Object.assign(a, data.items[a.id]);
  current = data;
  draw(view);
}

// The Project ahead buttons: the pressed one is the length on screen; all stay off while a load is in flight.
function setControls(project, busy) {
  for (const b of $('projBtns').querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.project === project));
    b.disabled = busy;
  }
  $('projClear').disabled = busy || !project;
}

function draw(view) {
  if (view === 'pattern') renderPattern(current); else render(current);
}

// The lineup rail: every channel in station.yaml order as "number name"; one that failed to load shows its key in red.
async function loadLineup() {
  let data;
  try {
    const res = await fetch('/api/lineup');
    data = await res.json();
    if (!res.ok) data = { error: `HTTP ${res.status}: ${data.error || 'no error message'}` };
  } catch (e) {
    data = { error: String(e) };
  }
  if (data.error) {
    $('lineup').innerHTML = `<div class="lstate error">${esc(data.error)}</div>`;
    return;
  }
  lineup = data.channels;
  if (!lineup.length) {
    $('lineup').innerHTML = '<div class="lstate muted">The station lists no channels.</div>';
    return;
  }
  $('lineup').innerHTML = lineup.map((c) => `<a data-key="${esc(c.channel)}" class="${c.error ? 'broken' : ''}"
      title="${esc(c.error ? `${c.channel}: ${c.error}` : c.channel)}">
      <span class="n">${esc(c.number ?? '—')}</span><span class="nm">${esc(c.display_name || c.channel)}</span></a>`).join('');
  $('lineupSelect').innerHTML = lineup.map((c) =>
    `<option value="${esc(c.channel)}">${esc(c.number == null ? c.channel : `${c.number} · ${c.display_name || c.channel}`)}</option>`).join('');
}

// Marks where the page is: the tab, the channel in the lineup, the sub-tab, and the links that keep the days.
function markRoute(r) {
  routeWithDraftWindow(r);
  for (const [id, tab] of [['tabChannels', 'channels'], ['tabEdit', 'edit'], ['tabGuide', 'guide'], ['tabHealth', 'health']]) {
    if (r.tab === tab) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current');
  }
  const railed = r.tab === 'channels' || r.tab === 'edit';
  $('app').classList.toggle('wide', !railed);
  $('lineup').hidden = !railed;
  $('lineupSelect').hidden = !railed;
  $('toolbar').hidden = r.tab !== 'channels';
  setControls(r.project, false);
  // Project ahead belongs to the schedule; Graphics has no projection to ask for.
  const projecting = r.tab === 'channels' && r.view !== 'graphics';
  for (const id of ['projState', 'projLabel', 'projBtns', 'projClear']) $(id).hidden = !projecting;
  if (!railed || !lineup) return;
  const project = r.project;
  $('projCtl').hidden = r.view === 'pools';
  for (const a of $('lineup').querySelectorAll('a')) {
    a.href = r.tab === 'edit' ? editHash(a.dataset.key) : channelHash(a.dataset.key, r.view, project);   // a draft belongs to one channel, so the rail drops it
    if (a.dataset.key === r.channel) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  $('lineupSelect').value = r.channel;
  if (r.tab === 'edit') {
    const sel = $('lineup').querySelector('[aria-current="page"]');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
    return;
  }
  for (const [id, view] of [['subSchedule', 'schedule'], ['subPattern', 'pattern'], ['subPools', 'pools'], ['subGraphics', 'graphics']]) {
    $(id).href = channelHash(r.channel, view, project, r.draft);
    if (r.view === view) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current');
  }
  const i = lineup.findIndex((c) => c.channel === r.channel);
  $('position').textContent = i < 0 ? '' : `${i + 1} of ${lineup.length} in station.yaml order`;
  const sel = $('lineup').querySelector('[aria-current="page"]');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

// ---- Edit: a channel's whole channel.yaml as text, checked by the daemon's loader and applied through the apply route.
// The draft bar and the note row under it are drawn once and only have their text changed, so nothing moves between states.
const EDIT_VALIDATE_MS = 400;
const EDIT_POLL_MS = 1000;
const EDIT_PREVIEW_POLL_MS = 2000; // a re-simulation takes seconds
const EDIT_POLL_DEADLINE_MS = 60000;
const editDrafts = {};   // channel key -> the text a person left unapplied, kept when they switch channels
let editState = null;    // the open page: { channel, base, text, valid, phase, ... }

// Line diff of the deployed text against the edit: which new lines are changed or added, which lines follow a deletion, and how many hunks.
function lineDiff(base, text) {
  const a = base.split('\n'), b = text.split('\n');
  let lo = 0;
  while (lo < a.length && lo < b.length && a[lo] === b[lo]) lo++;
  let ea = a.length, eb = b.length;
  while (ea > lo && eb > lo && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
  const n = ea - lo, m = eb - lo;
  const changed = new Set(), deleted = new Set();
  if (n * m > 4000000) {
    for (let j = lo; j < eb; j++) changed.add(j);
    if (n > m) deleted.add(eb);
  } else {
    const w = m + 1, dp = new Uint32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
      dp[i * w + j] = a[lo + i] === b[lo + j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
    }
    let i = 0, j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && a[lo + i] === b[lo + j]) { i++; j++; }
      else if (j < m && (i === n || dp[i * w + j + 1] >= dp[(i + 1) * w + j])) { changed.add(lo + j); j++; }
      else { deleted.add(lo + j); i++; }
    }
  }
  let hunks = 0, prev = -2;
  const marks = [...new Set([...changed, ...deleted])].sort((x, y) => x - y);
  for (const k of marks) { if (k !== prev + 1) hunks++; prev = k; }
  return { changed, deleted, hunks, lines: b.length };
}

const EDIT_RESULT = {
  applied: ['ok', 'Applied', 'The daemon reloaded and kept this channel.'],
  unchanged: ['ok', 'Unchanged', 'The text is the file already deployed; nothing was written.'],
  written_not_signalled: ['warn', 'Written, daemon not told', 'The file was written. The daemon is not running, so nothing has loaded it; it will on the next start.'],
};

async function editJson(url, body) {
  const res = await fetch(url, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let data;
  try { data = await res.json(); } catch (e) { data = {}; }
  return { ok: res.ok, status: res.status, data };
}

async function loadEdit(channel) {
  document.title = `etv-station · ${channel || 'Edit'} · Edit`;
  $('state').textContent = '';
  $('report').classList.remove('loading');
  stopEditTimers();
  if (!channel || (lineup && !lineup.some((c) => c.channel === channel))) {
    editState = null;
    $('report').innerHTML = `<div class="empty"><h1>No channel to edit</h1><p class="muted">${channel ? `The lineup has no channel ${esc(channel)}.` : 'The station lists no channels.'}</p></div>`;
    return;
  }
  const url = `/api/channels/${encodeURIComponent(channel)}`;
  $('report').innerHTML = `<div class="epage"><div class="ebar" id="ebar"><span class="ech">${esc(channel)}</span><span class="est">Loading…</span><span class="eval"></span>
      <button type="button" disabled>Discard</button><button type="button" disabled>Copy YAML</button><button type="button" class="primary" disabled>Apply to prod…</button></div>
    <div class="enote" id="enote"></div>
    <div class="ebody"><div class="ed"><div class="eload"><span class="spinner"></span>Loading the deployed channel.yaml…</div></div><aside class="pv"></aside></div></div>`;
  const ebar = $('ebar');
  let r;
  try { r = await editJson(`${url}/file`); } catch (e) { r = { ok: false, data: { error: String(e) } }; }
  if (!ebar.isConnected) return;
  if (!r.ok) {
    $('report').innerHTML = `<div class="epage"><div class="ebar"><span class="ech">${esc(channel)}</span></div><div class="enote bad">${esc(r.data.error || `HTTP ${r.status}`)}</div></div>`;
    return;
  }
  const base = r.data.yaml;
  editState = { channel, url, path: r.data.path, base, text: editDrafts[channel] && editDrafts[channel].base === base ? editDrafts[channel].text : base, valid: null, phase: 'edit', note: null, tab: 'schedule', preview: null, pvSeq: 0, pvTimer: null, schedSeq: -1, schedIdle: 0, seq: 0, profSeq: 0, timer: null, profTimer: null, poll: null };
  const stale = editDrafts[channel] && editDrafts[channel].base !== base;
  if (stale) delete editDrafts[channel];
  drawEdit();
  if (stale) editState.note = { kind: 'warn', html: '<b>The deployed file changed since you left this channel.</b> The unapplied draft was dropped so it cannot overwrite the newer file.' };
  editChanged(true);
}

function editLive(e) { return e === editState && !!$('etext') && $('etext').isConnected; }

// An unapplied draft is lost on reload or tab close, so the browser is asked first.
window.addEventListener('beforeunload', (ev) => { if (Object.keys(editDrafts).length) { ev.preventDefault(); ev.returnValue = ''; } });

function stopEditTimers() {
  if (!editState) return;
  clearTimeout(editState.timer); clearTimeout(editState.profTimer); clearTimeout(editState.poll); clearTimeout(editState.pvTimer);
}

function drawEdit() {
  const e = editState;
  $('report').innerHTML = `<div class="epage"><div class="ebar" id="ebar"><span class="ech" title="${esc(e.path)}">${esc(e.channel)}</span><span class="est" id="est"></span><span class="eval" id="eval"></span>
      <button type="button" id="ediscard">Discard</button><button type="button" id="ecopy">Copy YAML</button><button type="button" class="primary" id="eapply">Apply to prod…</button></div>
    <div class="enote" id="enote" aria-live="polite"></div>
    <div class="ebody"><div class="ed"><div class="gut" id="egut" aria-hidden="true"></div>
      <textarea id="etext" spellcheck="false" wrap="off" aria-label="${esc(e.channel)} channel.yaml"></textarea></div>
      <aside class="pv" aria-label="Preview"><nav class="pvtabs" id="pvtabs" role="tablist">
        <button type="button" role="tab" data-tab="schedule">Schedule vs deployed</button><button type="button" role="tab" data-tab="profile">Profile</button>
        <button type="button" role="tab" data-tab="slots">Published slots</button><button type="button" role="tab" data-tab="validation">Validation</button></nav>
        <div class="pvbody" id="pvbody"></div><div class="eprof" id="eprof" aria-label="Taste profiles" hidden><div class="muted">Reading the pools…</div></div></aside></div></div>`;
  const ta = $('etext');
  ta.value = e.text;
  ta.addEventListener('input', () => { if (e.phase === 'applying') return; e.text = ta.value; e.note = null; editChanged(false); });
  ta.addEventListener('scroll', () => { $('egut').scrollTop = ta.scrollTop; });
  for (const b of $('pvtabs').querySelectorAll('button')) b.addEventListener('click', () => { e.tab = b.dataset.tab; paintPreview(); if (e.tab === 'schedule' && e.preview && e.preview.data && e.preview.data.valid && e.preview.data.changed && !e.preview.sched) editSchedule(e.pvSeq, e.text); });
  $('ediscard').addEventListener('click', () => { if (e.phase === 'applying') return; e.text = e.base; delete editDrafts[e.channel]; e.note = null; ta.value = e.text; editChanged(false); });
  $('ecopy').addEventListener('click', () => editCopy());
  $('eapply').addEventListener('click', () => editApply());
}

// The text changed: redraw the gutter and the bar now, then check it with the loader and read its profiles after a pause.
function editChanged(first) {
  const e = editState;
  if (!e || !$('etext') || !$('etext').isConnected) return;
  e.diff = lineDiff(e.base, e.text);
  if (e.text === e.base) delete editDrafts[e.channel]; else editDrafts[e.channel] = { base: e.base, text: e.text };
  clearTimeout(e.profTimer);
  e.profSeq++; e.pvSeq++;
  clearTimeout(e.pvTimer);
  e.preview = null;
  // One request answers validity, fingerprint and rewind; the draft bar and the tabs read it.
  if (e.text === e.base) { e.valid = { ok: true, same: true }; e.pvTimer = null; }
  else { e.valid = null; e.pvTimer = setTimeout(editPreview, first ? 0 : EDIT_VALIDATE_MS); }
  e.profTimer = setTimeout(editProfiles, first ? 0 : EDIT_VALIDATE_MS);
  paintEdit();
}

function paintEdit() {
  const e = editState;
  if (!e || !$('etext') || !$('etext').isConnected) return;
  const d = e.diff, dirty = e.text !== e.base;
  const n = d.hunks;
  $('est').textContent = e.phase === 'applying' ? 'Applying…' : dirty ? `Draft · ${n} edit${n === 1 ? '' : 's'}` : e.note?.kind === 'bad' && e.note.sticky ? 'Not live' : 'Clean';
  const v = $('eval');
  let vtext = '', vcls = '';
  if (dirty && e.valid === null) vtext = 'checking…';
  else if (dirty && e.valid.ok) { vtext = 'valid ✓'; vcls = 'ok'; }
  else if (dirty) { vtext = e.valid.line ? `line ${e.valid.line}: ${e.valid.error}` : e.valid.error; vcls = 'bad'; }
  v.textContent = vtext; v.className = `eval ${vcls}`; v.title = vtext;
  const busy = e.phase === 'applying';
  $('ediscard').disabled = !dirty || busy;
  $('ecopy').disabled = false;
  $('eapply').disabled = !dirty || busy || !(e.valid && e.valid.ok);
  const note = $('enote');
  if (e.note) { note.className = `enote ${e.note.kind}`; note.innerHTML = e.note.html; }
  else if (dirty && e.valid && !e.valid.ok) { note.className = 'enote bad'; note.innerHTML = `<b>The loader rejects this text, so Apply is off.</b> ${esc(e.valid.error)}`; }
  else { note.className = 'enote'; note.innerHTML = `<span class="muted">${esc(e.path)} · ${d.lines} lines · edits are marked in the gutter against the deployed file</span>`; }
  const errLine = dirty && e.valid && !e.valid.ok ? e.valid.line : null;
  let rows = '';
  for (let i = 0; i < d.lines; i++) {
    const cls = [d.changed.has(i) ? 'chg' : '', d.deleted.has(i) ? 'del' : '', errLine === i + 1 ? 'err' : ''].filter(Boolean).join(' ');
    rows += `<div class="${cls}">${i + 1}</div>`;
  }
  $('egut').innerHTML = rows;
  $('egut').scrollTop = $('etext').scrollTop;
  paintPreview();
}

function editCopy() {
  const e = editState, ta = $('etext');
  const done = (ok) => { e.note = { kind: ok ? 'ok' : 'warn', html: ok ? `Copied ${e.diff.lines} lines to the clipboard. Nothing was written.` : 'The browser refused the clipboard. Select the text and copy it by hand.' }; paintEdit(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(e.text).then(() => done(true), () => done(false));
  else { ta.select(); done(document.execCommand('copy')); }
}

async function editApply() {
  const e = editState;
  if (!e || e.phase === 'applying' || !(e.valid && e.valid.ok) || e.text === e.base) return;
  if (!confirm(`Apply ${e.diff.hunks} edit${e.diff.hunks === 1 ? '' : 's'} to ${e.channel} on the deployed station?\n\n${rewindSentence(e)}\n\nThe file is backed up, replaced, and the daemon is told to reload it.`)) return;
  const text = e.text;
  e.phase = 'applying'; e.note = { kind: '', html: '<span class="spinner"></span>Writing the file and telling the daemon…' };
  $('etext').readOnly = true;
  paintEdit();
  const settle = (note, wrote) => {
    e.phase = 'edit'; e.note = note; $('etext').readOnly = false;
    if (wrote) { e.base = text; if (e.text === text) delete editDrafts[e.channel]; e.diff = lineDiff(e.base, e.text); }
    paintEdit();
  };
  let r;
  try { r = await editJson(`${e.url}/apply`, { yaml: text }); } catch (x) { r = { ok: false, status: 0, data: { error: String(x) } }; }
  if (!editLive(e)) return;
  if (r.status === 422) return settle({ kind: 'bad', html: `<b>Refused. Nothing was written.</b> ${esc(r.data.error)}` }, false);
  if (!r.ok) return settle({ kind: 'bad', html: `<b>The apply failed.</b> ${esc(r.data.error || `HTTP ${r.status}`)}` }, false);
  const st = r.data.status;
  if (st === 'unchanged') return settle({ kind: 'ok', html: `<b>${EDIT_RESULT.unchanged[1]}.</b> ${EDIT_RESULT.unchanged[2]}` }, true);
  if (st === 'written_not_signalled') return settle({ kind: 'warn', html: `<b>${EDIT_RESULT.written_not_signalled[1]}.</b> ${EDIT_RESULT.written_not_signalled[2]} Backup: ${esc(r.data.backup)}` }, true);
  if (st === 'written_signal_failed') return settle({ kind: 'bad', sticky: true, html: `<b>Written, but the daemon was not told.</b> ${esc(r.data.signal_error || '')} The running station still has the old channel; restart it or send SIGHUP. Backup: ${esc(r.data.backup)}` }, true);
  // signalled: the file is replaced; wait for the daemon's own record of the reload.
  e.base = text; delete editDrafts[e.channel];
  const began = Date.now(), after = r.data.seq_before;
  const poll = async () => {
    if (!editLive(e)) return;
    let s;
    try { s = await editJson(`${e.url}/apply/status?after=${after}`); } catch (x) { s = { ok: false, data: {} }; }
    if (!editLive(e)) return;
    const st2 = s.ok ? s.data.status : 'pending';
    const others = s.data.other_dropped ? ` ${s.data.other_dropped} other channel${s.data.other_dropped === 1 ? ' was' : 's were'} also dropped in that reload.` : '';
    if (st2 === 'applied') return settle({ kind: 'ok', html: `<b>Applied.</b> The daemon reloaded and kept ${esc(e.channel)}.${others}` }, true);
    if (st2 === 'channel_dropped') return settle({ kind: 'bad', sticky: true, html: `<b>Not live. The daemon dropped ${esc(e.channel)} from the lineup.</b> The file was written and the reload was logged as done. ${esc(s.data.reason || '')}${others}` }, true);
    if (st2 === 'reverted') return settle({ kind: 'bad', sticky: true, html: `<b>Not live. The file was written, the daemon reloaded and rejected it.</b> ${esc(s.data.reason || '')}` }, true);
    if (st2 === 'failed') return settle({ kind: 'bad', sticky: true, html: `<b>Not live. The daemon's reload failed.</b> ${esc(s.data.reason || '')}` }, true);
    if (Date.now() - began > EDIT_POLL_DEADLINE_MS) return settle({ kind: 'warn', html: `<b>No answer from the daemon.</b> The file was written, but no reload was recorded in ${EDIT_POLL_DEADLINE_MS / 1000} s. Check the station's log.` }, true);
    e.note = { kind: '', html: `<span class="spinner"></span>Written. Waiting for the daemon to report the reload… (${Math.round((Date.now() - began) / 1000)}s)` };
    paintEdit();
    e.poll = setTimeout(poll, EDIT_POLL_MS);
  };
  poll();
}


// ---- Preview: what applying this text would do, from POST /preview. Four tabs in one fixed frame.
const utcShort = (ts) => new Date(ts * 1000).toISOString().slice(5, 16).replace('T', ' ') + ' UTC';
const rankOf = (r) => (r == null ? '' : ` (rank ${r})`);

// One sentence for the Apply confirmation: what the preview says about published slots, or that it is not known.
function rewindSentence(e) {
  const pv = e.preview;
  if (!pv || pv.text !== e.text || !pv.data || !pv.data.rewind) return 'It is unknown whether published slots rewind: the preview has not answered for this text.';
  const r = pv.data.rewind;
  if (r.state === 'rewinds') return `Applying rewinds ${r.airings} published airing${r.airings === 1 ? '' : 's'}${r.bumpers ? ` and ${r.bumpers} bumper${r.bumpers === 1 ? '' : 's'}` : ''}, ${utcShort(r.from)} to ${utcShort(r.to)}.`;
  if (r.state === 'none') return `Published slots do not move: ${r.why}.`;
  return `It is unknown whether published slots rewind: ${r.why}.`;
}

// The quick answer (validity, fingerprint, rewind) never waits on the schedule: that is a second request, made only while the Schedule tab is open.
// The daemon compares an edit with the fingerprint it recorded, not with the file: when those already differ, a reload rewinds whatever the edit is.
function daemonNote(d) {
  return d.fingerprint && d.fingerprint.daemon === 'differs'
    ? '<div class="notice" style="margin-top:8px">The fingerprint the daemon recorded for this channel differs from the file’s now (an earlier change not yet reloaded, or a difference in the daemon’s environment). The daemon may rewind published slots on its next reload whatever this edit is.</div>' : '';
}

function editPreview() {
  const e = editState;
  if (!editLive(e) || e.text === e.base) return;
  clearTimeout(e.pvTimer);
  const seq = ++e.pvSeq, text = e.text;
  (async () => {
    let r;
    try { r = await editJson(`${e.url}/preview`, { yaml: text, schedule: false }); } catch (x) { r = { ok: false, status: 0, data: { error: String(x) } }; }
    if (!editLive(e) || seq !== e.pvSeq) return;
    e.preview = { text, data: r.ok ? r.data : null, error: r.ok ? null : (r.data.error || `HTTP ${r.status}`), sched: null };
    e.valid = r.ok && r.data.valid ? { ok: true } : { ok: false, error: r.data.error || `HTTP ${r.status}`, line: r.data.line || null };
    paintEdit();
    if (e.tab === 'schedule' && r.ok && r.data.valid && r.data.changed) editSchedule(seq, text);
  })();
}

async function editSchedule(seq, text) {
  const e = editState;
  if (!editLive(e) || seq !== e.pvSeq || !e.preview || e.preview.text !== text) return;
  if (e.schedSeq === seq && e.preview.sched !== null && !e.preview.sched.pending) return;
  // The daemon regenerates on this fingerprint alone, so an unchanged one is the same schedule: nothing to project.
  if (e.preview.data && e.preview.data.fingerprint && e.preview.data.fingerprint.state === 'same') { e.preview.sched = { days: 0, changed_airings: [], same: true }; paintPreview(); return; }
  if (e.schedSeq !== seq) { e.schedSeq = seq; e.schedIdle = 0; }
  clearTimeout(e.pvTimer);
  let r;
  try { r = await editJson(`${e.url}/preview`, { yaml: text, schedule: true }); } catch (x) { r = { ok: false, status: 0, data: { error: String(x) } }; }
  if (!editLive(e) || seq !== e.pvSeq) return;
  let sched = r.ok && r.data.schedule ? r.data.schedule : { error: r.data.error || `HTTP ${r.status}` };
  if (r.ok && r.data.changed === false) sched = { days: 0, changed_airings: [] };
  // A pending projection with an idle worker on two polls in a row has no one working on it (one poll can land between a finish and the next read).
  if (sched.pending) {
    const idle = !!sched.worker && sched.worker.running_secs == null && !sched.worker.queued;
    e.schedIdle = idle ? (e.schedIdle || 0) + 1 : 0;
    if (e.schedIdle >= 2) sched = { error: 'The projection worker is idle but this projection never landed. Check the station\'s log.' };
  }
  e.preview.sched = sched;
  paintPreview();
  if (sched.pending) e.pvTimer = setTimeout(() => editSchedule(seq, text), EDIT_PREVIEW_POLL_MS);
}

// What the projection worker is doing, in words: a projection takes seconds on a quiet machine and over a minute on a busy one.
function workerNote(w) {
  if (!w) return 'this takes seconds.';
  const run = w.running_secs == null ? 'starting' : `running for ${w.running_secs} s`;
  return `${run}${w.queued ? `, ${w.queued} queued behind it` : ''}.`;
}

function paintPreview() {
  const e = editState, body = $('pvbody');
  if (!e || !body || !body.isConnected) return;
  for (const b of $('pvtabs').querySelectorAll('button')) {
    b.setAttribute('aria-selected', b.dataset.tab === e.tab ? 'true' : 'false');
    b.classList.toggle('bad', b.dataset.tab === 'validation' && e.text !== e.base && !!e.valid && !e.valid.ok);
  }
  $('eprof').hidden = e.tab !== 'profile';
  body.hidden = e.tab === 'profile';
  if (e.tab === 'profile') return;
  const dirty = e.text !== e.base, pv = e.preview, d = pv && pv.text === e.text ? pv.data : null;
  let html = '';
  if (e.tab === 'validation') {
    if (!dirty) html = '<div class="muted">No changes to check.</div>';
    else if (!e.valid) html = '<div class="muted"><span class="spinner"></span>Checking with the loader…</div>';
    else if (e.valid.ok) html = '<div class="pvbig" style="color:var(--up)">valid ✓</div><div class="muted">The loader keeps this channel in the lineup.</div>';
    else html = `<div class="pvrow"><b>${e.valid.line ? `Line ${esc(e.valid.line)}` : 'Whole file'}</b>
        ${e.valid.line ? '<button type="button" id="pvgo" style="float:right">Go to line</button>' : ''}<div class="error" style="margin-top:4px">${esc(e.valid.error)}</div></div>`;
  } else if (!dirty) {
    html = '<div class="muted">No changes: no airing moves and no published slot rewinds.</div>';
  } else if (e.valid && !e.valid.ok) {
    html = '<div class="muted">The loader rejects this text, so there is nothing to preview. See Validation.</div>';
  } else if (!d) {
    html = pv && pv.error ? `<div class="error">${esc(pv.error)}</div>` : '<div class="muted"><span class="spinner"></span>Asking the daemon’s loader and published schedule…</div>';
  } else if (e.tab === 'slots') {
    const r = d.rewind || {};
    if (r.state === 'rewinds') html = `<div class="pvbig">${esc(r.airings)} published airing${r.airings === 1 ? '' : 's'} rewind</div>${r.bumpers ? `<div class="muted">plus ${esc(r.bumpers)} bumper${r.bumpers === 1 ? '' : 's'} in the same span</div>` : ''}
        <div class="pvrow"><span class="t">${esc(utcShort(r.from))} → ${esc(utcShort(r.to))}</span><div class="muted">${esc(r.basis)}. Aired and on-screen airings are never touched. As of ${esc(utcShort(r.as_of))}; the daemon cuts at its own clock when it reloads.</div></div>${daemonNote(d)}`;
    else if (r.state === 'none') html = `<div class="pvbig">No published slot rewinds</div><div class="muted">${esc(r.why)}.</div>${daemonNote(d)}`;
    else html = `<div class="pvbig">Unknown</div><div class="muted">This preview cannot tell whether applying rewinds published slots: ${esc(r.why)}. The apply confirmation says so too.</div>`;
  } else if (e.tab === 'schedule') {
    const sc = pv.sched;
    if (!sc) html = '<div class="muted"><span class="spinner"></span>Projecting the schedule from this text…</div>';
    else if (sc.error) html = `<div class="error">${esc(sc.error)}</div>`;
    else if (sc.pending) html = `<div class="muted"><span class="spinner"></span>Re-projecting ${esc(sc.days)} days from this text and from the deployed file… ${esc(workerNote(sc.worker))}</div>`;
    else if (!sc.changed_airings.length) html = `<div class="pvbig">No airing differs</div><div class="muted">${sc.same ? 'Only comments or formatting changed: the daemon’s regeneration fingerprint is unchanged, so the schedule is the deployed one.' : sc.days ? `Over the next ${esc(sc.days)} days the schedule from this text matches the deployed one at every instant.` : 'This text is the deployed file.'}</div>`;
    else html = `<div class="pvbig">${sc.changed_airings.length} airing${sc.changed_airings.length === 1 ? '' : 's'} differ</div>` + sc.changed_airings.map((a) => {
      const was = a.deployed;
      const mv = a.rank != null && was && was.rank != null ? `<span class="mv">${was.rank === a.rank ? 'rank ' + a.rank + ' (same)' : `rank ${was.rank} → ${a.rank}`}</span>` : '';
      return `<div class="pvrow"><span class="t">${esc(utcShort(a.start))}</span> ${esc(a.pool || '')} ${mv}<div><b>${esc(a.title)}</b>${esc(rankOf(a.rank))}</div>
        <div class="was">was ${was ? `${esc(was.title)}${esc(rankOf(was.rank))}${was.start !== a.start ? ` at ${esc(utcShort(was.start))}` : ''}` : 'nothing scheduled in this place'}</div></div>`;
    }).join('');
  }
  body.innerHTML = html;
  const go = $('pvgo');
  if (go) go.addEventListener('click', () => {
    const ta = $('etext'), line = e.valid.line;
    const starts = ta.value.split('\n');
    let from = 0;
    for (let i = 0; i < line - 1 && i < starts.length; i++) from += starts[i].length + 1;
    ta.focus();
    ta.setSelectionRange(from, from + (starts[line - 1] || '').length);
    ta.scrollTop = Math.max(0, (line - 3) * 18);
    $('egut').scrollTop = ta.scrollTop;
  });
}

// The profile panel: the plugin pools of the text as it stands, and edits that are spliced back into the text.
async function editProfiles(op) {
  const e = editState, ta = $('etext');
  if (!e || !ta || !ta.isConnected) return;
  const seq = ++e.profSeq;
  let r;
  try { r = await editJson(`${e.url}/profile`, { yaml: e.text, op: 'read' }); } catch (x) { r = { ok: false, data: { error: String(x) } }; }
  if (e !== editState || seq !== e.profSeq || !ta.isConnected) return;
  paintProfiles(r.ok ? r.data : { pools: [], error: r.data.error || `HTTP ${r.status}` });
}

const PROFILE_KINDS = ['keyword', 'genre', 'label', 'cast', 'director', 'writer', 'producer', 'country', 'studio', 'content_rating', 'item', 'set'];
function paintProfiles(d) {
  const panel = $('eprof');
  if (!panel) return;
  if (d.error) { panel.innerHTML = `<h2>Taste profiles</h2><div class="muted">The text does not parse, so the profiles cannot be read: ${esc(d.error)}</div>`; return; }
  if (!d.pools.length) { panel.innerHTML = '<h2>Taste profiles</h2><div class="muted">No pool in this file is scored by a plugin.</div>'; return; }
  panel.innerHTML = `<h2>Taste profiles</h2>` + d.pools.map((p) => `<div class="pool" data-pool="${esc(p.name)}"><b>${esc(p.name)}</b>
    ${p.entries.map((en, i) => {
      const { weight, exclude, require, ...ref } = en;
      const [k, v] = Object.entries(ref)[0] || ['', ''];
      return `<div class="pe" data-i="${i}"><span class="k" title="${esc(`${k}: ${v}`)}">${esc(k)}: ${esc(v)}</span>
        ${weight != null ? `<input class="w" type="number" step="0.5" value="${esc(weight)}" aria-label="weight">` : `<span class="muted">${exclude ? 'exclude' : require ? 'require' : ''}</span>`}
        <button type="button" class="prm" aria-label="Remove">×</button></div>`;
    }).join('') || '<div class="muted">No inline profile entries.</div>'}
    <div class="padd"><select>${PROFILE_KINDS.map((k) => `<option>${k}</option>`).join('')}</select><input class="v" placeholder="value" aria-label="value"><input class="w" type="number" step="0.5" value="1" aria-label="weight"><button type="button" class="pad">Add</button></div></div>`).join('')
    + '<p class="muted">Editing a profile rewrites that pool’s <code>profile:</code> block in the text; every other line stays.</p>';
  for (const pool of panel.querySelectorAll('.pool')) {
    const name = pool.dataset.pool;
    pool.querySelector('.pad').addEventListener('click', () => {
      const kind = pool.querySelector('select').value, value = pool.querySelector('input.v').value.trim();
      const weight = Number(pool.querySelector('.padd input.w').value);
      if (value) editProfileOp('add', name, { [kind]: value, weight });
    });
    for (const row of pool.querySelectorAll('.pe')) {
      const i = Number(row.dataset.i);
      row.querySelector('.prm').addEventListener('click', () => editProfileOp('remove', name, { index: i }));
      const w = row.querySelector('input.w');
      if (w) w.addEventListener('change', () => editProfileOp('update', name, { index: i, weight: Number(w.value) }));
    }
  }
}

async function editProfileOp(op, pool, entry) {
  const e = editState, ta = $('etext');
  if (!e || e.phase === 'applying') return;
  const sent = e.text;
  let r;
  try { r = await editJson(`${e.url}/profile`, { yaml: sent, op, pool, entry }); } catch (x) { r = { ok: false, data: { error: String(x) } }; }
  if (e !== editState || !ta.isConnected) return;
  if (e.text !== sent || e.phase === 'applying') { e.note = { kind: 'warn', html: 'The text changed while the profile edit ran, so it was not applied. Make the edit again.' }; paintEdit(); return; }
  if (!r.ok) { e.note = { kind: 'bad', html: `<b>Profile edit refused.</b> ${esc(r.data.error || `HTTP ${r.status}`)}` }; paintEdit(); return; }
  e.text = r.data.yaml; e.note = null;
  ta.value = e.text;
  editChanged(false);
  paintProfiles(r.data);
}

// ---- Health: each channel's encoder verdict, ETV-next's failure state and its last stall. Read-only.
let healthSeq = 0;
const VERDICT_WORDS = { PASS: 'Passing', FAIL: 'Failing', STALE: 'Stale', NONE: 'No transcode recorded' };
const utcOf = (iso) => (iso || '').replace('T', ' ').replace(/(\.\d+)?Z$/, '') + ' UTC';
const ageOf = (secs) => secs == null ? '—' : secs < 3600 ? `${Math.round(secs / 60)}m` : secs < 172800 ? `${Math.round(secs / 3600)}h` : `${Math.round(secs / 86400)}d`;
// A time as UTC and station-local, e.g. "2026-10-19 19:18 UTC (3:18pm EDT)".
function bothClocks(iso, tz) {
  const ms = Date.parse(iso);
  if (Number.isNaN(ms)) return esc(iso || '—');
  if (!tz) return esc(utcOf(new Date(ms).toISOString().slice(0, 16) + 'Z'));
  const local = new Date(ms).toLocaleString('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', timeZoneName: 'short', month: 'short', day: 'numeric' });
  return `${esc(utcOf(new Date(ms).toISOString().slice(0, 16) + 'Z'))} <span class="muted">(${esc(local)})</span>`;
}

async function loadHealth() {
  const seq = ++healthSeq;
  const began = Date.now();
  document.title = 'etv-station · Health';
  $('state').textContent = '';
  $('report').classList.remove('loading');
  $('report').innerHTML = `<div class="gtool"><strong>Health</strong></div><div id="hstate"></div>`;
  const tick = () => { if ($('hstate')) $('hstate').innerHTML = `<span class="spinner"></span>Reading channel health… (${Math.round((Date.now() - began) / 1000)}s)`; };
  tick();
  const timer = setInterval(tick, 1000);
  let build = {}, data, renders = null, audio = null, shots = null;
  try {
    const [h, c, rr, a, sh] = await Promise.all([fetch('/api/health'), fetch('/api/health/channels'), fetch('/api/health/renders'), fetch('/api/health/audio'), fetch('/api/health/shots')]);
    shots = await sh.json().catch(() => null);
    renders = await rr.json().catch(() => null);
    build = await h.json().catch(() => ({}));
    audio = await a.json().catch(() => null);
    data = await c.json().catch(() => ({}));
    if (!c.ok) data = { error: `HTTP ${c.status}: ${data.error || 'no error message'}` };
  } catch (e) {
    data = { error: String(e.message || e) };
  } finally {
    clearInterval(timer);
  }
  if (seq !== healthSeq) return;
  const head = `<div class="gtool"><strong>Health</strong><span class="muted">revision ${esc(build.revision || 'unknown')} · built ${build.build_time && build.build_time !== 'unknown' ? bothClocks(build.build_time, data.tz) : 'unknown'}</span>
    <button type="button" id="healthReload">Reload</button></div>`;
  if (data.error) {
    $('report').innerHTML = head + `<div class="error">${esc(data.error)}</div>`;
  } else {
    $('report').innerHTML = head + drawAudioHealth(audio) + drawShotsHealth(shots) + drawHealth(data) + drawRenders(renders);
  }
  $('healthReload').addEventListener('click', loadHealth);
}

// ` · 120.0 bpm · 8B` for an entry with audio facts, '' for one without.
function audioHint(a) {
  return a && a.bpm ? ` · ${a.bpm.toFixed(1)} bpm${a.camelot ? ` · ${a.camelot}` : ''}` : '';
}

function drawAudioHealth(a) {
  if (!a || a.error) return '';
  const line = `Audio facts: ${esc(a.analyzed)} of ${esc(a.total)} entries analyzed${a.failed ? `, ${esc(a.failed)} failed` : ''}.`;
  return a.problem ? `<div class="notice">${line} ${esc(a.problem)}</div>` : `<p class="muted">${line}</p>`;
}

function drawShotsHealth(s) {
  if (!s || s.error || !(s.problems || []).length) return '';
  return s.problems.map((p) => `<div class="notice">${esc(p)}</div>`).join('');
}

function drawHealth(d) {
  const u = d.upstream;
  const upstream = !u ? ''
    : u.pending ? `<div class="muted">Reading ETV-next's failure state; the Failures column is blank until it answers. Reload in a moment.</div>`
    : u.stale_secs != null ? `<div class="muted">ETV-next is slow to answer; the Failures column shows a reading ${esc(u.stale_secs)}s old.</div>`
    : `<div class="error">ETV-next is unreachable or answered badly, so failure state is missing below.\nTried ${esc(u.url)}\n${esc(u.error)}</div>`;
  const expected = d.expected && d.expected.encoder
    ? `<p class="muted">Expected encoder: ${esc(d.expected.encoder)}${d.expected.vaapi_device ? ` on ${esc(d.expected.vaapi_device)}` : ''}.</p>`
    : `<p class="muted">No hardware encoder is configured (ETV_ACCEL), so every transcode counts as software.</p>`;
  const rows = d.channels.map((c) => {
    const e = c.encoder;
    const cls = e.verdict === 'FAIL' ? 'v-fail' : e.verdict === 'STALE' ? 'v-stale' : '';
    const fail = c.failures == null ? '—'
      : c.failed ? `failed, ${c.retry_in_secs > 0 ? `503 for ${c.retry_in_secs}s more` : 'retry open'}${c.last_failure ? ` — ${esc(c.last_failure.cause)}` : ''}`
      : c.failures > 0 ? `${c.failures} consecutive` : 'none';
    const stall = c.last_stall
      ? `${bothClocks(c.last_stall.at, d.tz)}${c.last_stall.recovered ? ' <span class="muted">(recovered)</span>' : ' <span class="muted">(not recovered)</span>'}`
      : '<span class="muted">none logged</span>';
    return `<tr><td class="num">${esc(c.channel)}</td><td>${esc(c.name || c.key)}</td>
      <td class="${cls}" title="${esc(e.reason)}">${esc(VERDICT_WORDS[e.verdict] || e.verdict)}${e.verdict === 'PASS' || e.verdict === 'NONE' ? '' : ` — ${esc(e.reason)}`}</td>
      <td>${fail}</td><td>${stall}</td><td class="num">${esc(ageOf(c.argv_log_age_secs))}</td></tr>`;
  }).join('');
  const diag = d.diag && !d.diag.readable
    ? `<div class="notice">The diag folder ${esc(d.diag.dir || '(unset)')} cannot be read, so no channel has an argv log or stall history here (ETV_DIAG_DIR).</div>` : '';
  return `${upstream}${diag}${expected}<table class="health"><thead><tr><th class="num">Channel</th><th>Name</th><th>Encoder</th><th>Failures</th><th>Last stall</th><th class="num">Argv log age</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function drawRenders(r) {
  if (!r || r.error) return `<h3>Chapter renderer</h3><div class="error">${esc(r && r.error ? r.error : 'no answer from /api/health/renders')}</div>`;
  const deps = (r.dependencies || []).map((d) =>
    `<tr><td>${esc(d.name)}</td><td class="${d.status === 'missing' ? 'v-fail' : ''}">${esc(d.status)}</td><td>${esc(d.detail)}</td></tr>`).join('');
  const depTable = `<table class="health"><thead><tr><th>Dependency</th><th>Status</th><th>Detail</th></tr></thead><tbody>${deps}</tbody></table>`;
  if (!r.configured) return `<h3>Chapter renderer</h3><p class="muted">${esc(r.reason)}</p>${depTable}`;
  const jobs = Object.values(r.jobs || {}).flat().map((j) =>
    `<tr><td>${esc(j.id)}</td><td class="${j.status === 'failed' ? 'v-fail' : ''}">${esc(j.status)}</td><td>${esc(j.failed_layer || '')}</td><td>${esc(j.last_error || '')}</td></tr>`).join('');
  const counts = Object.entries(r.counts || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(' · ');
  return `<h3>Chapter renderer</h3><p class="muted">${counts} · cache ${esc(r.cache_bytes)} of ${esc(r.cache_cap_bytes)} bytes</p>${depTable}
    <table class="health"><thead><tr><th>Job</th><th>State</th><th>Failed layer</th><th>Last error</th></tr></thead><tbody>${jobs}</tbody></table>`;
}

let shown = null;   // the channel and projection the report holds, so a sub-tab switch redraws without refetching
async function route() {
  const r = routeWithDraftWindow(parseRoute());
  if (!lineup) await loadLineup();
  if (r.tab === 'channels' && !r.channel) {
    // A bare `#/channels` (or no hash) opens the first channel in the lineup.
    if (lineup && lineup.length) { location.replace(channelHash(lineup[0].channel, 'schedule', r.project)); return; }
  }
  if (r.tab === 'edit' && !r.channel && lineup && lineup.length) { location.replace(editHash(lineup[0].channel)); return; }
  markRoute(r);
  stopPlayer();
  if (r.tab === 'edit') { loadSeq++; guideSeq++; poolsSeq++; healthSeq++; shown = null; current = null; loadEdit(r.channel); return; }
  if (r.tab !== 'channels' || r.view !== 'graphics') { gSeq++; renderSeq++; }
  if (r.tab === 'guide') { loadSeq++; poolsSeq++; healthSeq++; shown = null; current = null; document.title = 'etv-station · Guide'; $('state').textContent = ''; $('report').classList.remove('loading'); loadGuide(); return; }
  if (r.tab === 'health') { loadSeq++; guideSeq++; poolsSeq++; shown = null; current = null; loadHealth(); return; }
  if (!r.channel) return;
  if (r.view === 'pools') { guideSeq++; healthSeq++; shown = null; await loadPools(r.channel, r.draft); return; }
  if (r.view === 'graphics') { loadSeq++; guideSeq++; poolsSeq++; healthSeq++; shown = null; current = null; loadGraphics(r.channel); return; }
  guideSeq++; poolsSeq++; healthSeq++;
  const key = `${r.channel}|${r.project}|${r.view === 'schedule' ? r.draft || '' : ''}`;
  if (shown === key && current) { draw(r.view); return; }
  shown = key;
  if (r.draft && r.view === 'schedule') await loadDraft(r.channel, r.project, r.draft, r.view);
  else await load(r.channel, r.project, r.view);
}

// Channels › Graphics: the overlay and bumper scripts the channel names, each rendered on request.
// A render is queued (POST), then asked for again every GRAPHICS_POLL_MS until it is done or failed.
const GRAPHICS_POLL_MS = 2000;
let gSeq = 0;      // a newer Graphics load or render supersedes an older one still polling
let renderSeq = 0; // a newer render request supersedes the one still polling

async function loadGraphics(channel) {
  const seq = ++gSeq;
  document.title = `etv-station · ${channel} · Graphics`;
  $('state').textContent = '';
