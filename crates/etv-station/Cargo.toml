[package]
name = "etv-station"
version = "0.1.0"
edition = "2024"

[dependencies]
cel = { workspace = true }
clap = { workspace = true }
ersatztv-core = { workspace = true }
ersatztv-playout = { workspace = true }
etv-overlay = { workspace = true }
glob = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
nix = { workspace = true }
plexdb-reader = { workspace = true }
regex = { workspace = true }
rhai = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
time-tz = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The lineup we render is ETV-next's own config type. Deserializing it back
# through that type in tests is what makes a renamed or mistyped key a build
# failure here instead of a wrong value nobody sees until Plex is confused.
ersatztv = { workspace = true }
# Guards the identity fixture shared with plex-db-ex; see tests/entry_id_fixture.rs.
sha2 = { workspace = true }
tempfile = { workspace = true }
# `test-util` gates tokio's pausable clock, which is how the shared watch
# history's refresh window is tested without a real sleep.
tokio = { workspace = true, features = ["test-util"] }

[lib]
name = "etv_station"
path = "src/lib.rs"

[[bin]]
name = "etv-station"
path = "src/main.rs"
